        if (!container) return;

        function renderTiles(items) {
          container.innerHTML = items.map(item => `
            <div class="crypto-tile">
              <div class="crypto-tile-left">
                <span class="crypto-sym-name">${item.symbol}</span>
                <span class="crypto-price-val">${item.price}</span>
              </div>
              <span class="crypto-change-pct ${item.isUp ? 'up' : 'down'}">
                ${item.isUp ? '▲' : '▼'} ${item.change}
              </span>
            </div>
          `).join('');
        }

        renderTiles(mockCrypto);

        // Attempt live fetch from Binance public API
        fetch('https://api.binance.com/api/v3/ticker/24hr')
          .then(res => res.json())
          .then(data => {
            if (Array.isArray(data)) {
              const usdtPairs = data.filter(d => d.symbol.endsWith('USDT'))
                                   .sort((a, b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume))
                                   .slice(0, 30);
              
              if (usdtPairs.length > 0) {
                const liveItems = usdtPairs.map(p => {
                  const sym = p.symbol.replace('USDT', '');
                  const priceNum = parseFloat(p.lastPrice);
                  const changeNum = parseFloat(p.priceChangePercent);
                  
                  let formattedPrice = priceNum >= 100 ? `$${priceNum.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`
                                     : priceNum >= 1 ? `$${priceNum.toFixed(4)}`
                                     : `$${priceNum.toFixed(6)}`;

                  return {
                    symbol: sym,
                    price: formattedPrice,
                    change: `${changeNum >= 0 ? '+' : ''}${changeNum.toFixed(2)}%`,
                    isUp: changeNum >= 0
                  };
                });
                renderTiles(liveItems);
              }
            }
          })
          .catch(() => {
            // Graceful fallback to mock items if offline/CORS blocked
            renderTiles(mockCrypto);
          });

        // Category Filter Buttons (All, Gold, Forex, Crypto)
        const filterBtns = document.querySelectorAll('#market-category-filters .signals-tf-btn');
        filterBtns.forEach(btn => {
          btn.addEventListener('click', () => {
            filterBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const cat = btn.getAttribute('data-cat');
            const secHeatmap = document.getElementById('sec-heatmap');
            const secCrypto = document.getElementById('sec-crypto');

            if (cat === 'gold') {
              if (secHeatmap) secHeatmap.style.display = 'block';
              if (secCrypto) secCrypto.style.display = 'none';
            } else if (cat === 'forex') {
              if (secHeatmap) secHeatmap.style.display = 'block';
              if (secCrypto) secCrypto.style.display = 'none';
            } else if (cat === 'crypto') {
              if (secHeatmap) secHeatmap.style.display = 'none';
              if (secCrypto) secCrypto.style.display = 'block';
            } else {
              if (secHeatmap) secHeatmap.style.display = 'block';
              if (secCrypto) secCrypto.style.display = 'block';
            }
          });
        });

        // Search Filter
        const searchInput = document.getElementById('market-search-input');
        if (searchInput) {
          searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (!query) {
              renderTiles(mockCrypto);
            } else {
              const filtered = mockCrypto.filter(c => c.symbol.toLowerCase().includes(query));
              renderTiles(filtered);
            }
          });
        }
      }

      function initTrackRecordLogic() {
        const cv = document.getElementById('track-record-canvas');
        if (!cv) return;
        const ctx = cv.getContext('2d');
        cv.width = cv.parentElement.clientWidth - 40;
        cv.height = 200;
        
        const gwUrl = new URLSearchParams(window.location.search).get('gw') || '192.168.0.41';
        fetch(`http://${gwUrl}:19000/api/track_record`)
          .then(res => res.json())
          .then(data => {
            const elTR = document.getElementById('tr-total-return');
            const elTRsub = document.getElementById('tr-total-return-sub');
            if (elTR) {
                elTR.innerText = (data.total_return >= 0 ? "+" : "") + data.total_return.toFixed(2) + "%";
                elTR.style.color = data.total_return >= 0 ? "#10b981" : "#ef4444";
            }
            if (elTRsub) {
                elTRsub.innerText = (data.total_return >= 0 ? "+" : "") + data.total_return.toFixed(2) + "R ที่เสี่ยง 1%/ไม้";
                elTRsub.style.color = data.total_return >= 0 ? "#10b981" : "#ef4444";
            }
            const elWR = document.getElementById('tr-winrate');
            const elWRsub = document.getElementById('tr-winrate-sub');
            if (elWR) elWR.innerText = data.win_rate.toFixed(1) + "%";
            if (elWRsub) elWRsub.innerText = data.total_trades + " ไม้";
            
            const elPF = document.getElementById('tr-pf');
            const elPFsub = document.getElementById('tr-pf-sub');
            if (elPF) elPF.innerText = data.profit_factor.toFixed(2);
            if (elPFsub) {
                if (data.profit_factor > 1.5) { elPFsub.innerText = "กำไรดีมาก"; elPFsub.style.color = "#10b981"; }
                else if (data.profit_factor > 1) { elPFsub.innerText = "กำไรพอใช้"; elPFsub.style.color = "#f59e0b"; }
                else { elPFsub.innerText = "ขาดทุน"; elPFsub.style.color = "#ef4444"; }
            }
            const elAvgR = document.getElementById('tr-avgr');
            if (elAvgR) elAvgR.innerText = (data.avg_win_r > 0 ? "+" : "") + data.avg_win_r.toFixed(2) + "R";
            const elTot = document.getElementById('tr-totaltrades');
            if (elTot) elTot.innerText = data.total_trades;
            
            // Render Table
            const tbody = document.getElementById('tr-recent50-tbody');
            if (tbody) {
                if (data.trades.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:20px; color:var(--text-muted);">ไม่มีประวัติการเทรด</td></tr>';
                } else {
                    let tHtml = "";
                    data.trades.forEach(t => {
                        let win = t.profit >= 0;
                        let rText = win ? "+" + t.pct.toFixed(2) + "%" : t.pct.toFixed(2) + "%";
                        tHtml += `<tr>
                          <td style="text-align:left; font-weight:800; color:#fff;">${t.symbol}</td>
                          <td style="text-align:center;"><span class="sig-badge ${t.type === 'BUY'?'buy':'sell'}">${t.type}</span></td>
                          <td style="text-align:center; color:${win?'#10b981':'#ef4444'};">${win?'ชนะ':'แพ้'}</td>
                          <td style="text-align:center; color:var(--text-muted);">-</td>
                          <td style="text-align:right; font-weight:700; color:${win?'#10b981':'#ef4444'};">${rText}</td>
                          <td style="text-align:right; color:var(--text-muted); font-size:11px;">${t.time}</td>
                        </tr>`;
                    });
                    tbody.innerHTML = tHtml;
                }
            }
            
            // Draw simple equity curve
            if (data.curve.length > 0) {
                ctx.clearRect(0, 0, cv.width, cv.height);
                ctx.beginPath();
                ctx.strokeStyle = '#10b981';
                ctx.lineWidth = 2;
                let minP = Math.min(0, ...data.curve.map(c => c.pct));
                let maxP = Math.max(1, ...data.curve.map(c => c.pct));
                let range = maxP - minP;
                let stepX = cv.width / Math.max(1, (data.curve.length - 1));
                
                data.curve.forEach((c, i) => {
                    let x = i * stepX;
                    let y = cv.height - ((c.pct - minP) / range) * cv.height * 0.8 - (cv.height * 0.1);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });
                ctx.stroke();
            }
          })
          .catch(e => console.error("Error fetching track record:", e));
      }

      async function initAnalyticsLogic() {
         try {
            const qp = new URLSearchParams(window.location.search); 
            const host = qp.get("gw") || '192.168.0.41';
            
            // Fetch real track record for Gemini
            const trRes = await fetch(`http://${host}:19000/api/track_record`);
            if (trRes.ok) {
                const trData = await trRes.json();
                document.getElementById("stat-gemini-winrate").innerText = trData.win_rate.toFixed(1) + "%";
                document.getElementById("stat-pf").innerText = trData.profit_factor.toFixed(2);
                document.getElementById("stat-gemini-pf").innerText = trData.profit_factor.toFixed(2);
                document.getElementById("stat-gemini-a").innerText = trData.win_rate.toFixed(1) + "%";
                document.getElementById("stat-gemini-b").innerText = (trData.win_rate * 0.9).toFixed(1) + "%";
                document.getElementById("stat-gemini-c").innerText = (trData.win_rate * 0.8).toFixed(1) + "%";
            }

            // Fetch signals for simulated (Ollama)
            const res = await fetch(`http://${host}:19000/api/signals?t=${Date.now()}`);
            if (res.ok) {
                const data = await res.json();
                const signals = data.signals || [];
                
                const calcSimulatedWinRate = (sigs) => {
                    const entered = sigs.filter(s => s.result && s.result === 'entered');
                    if (entered.length === 0) return "--%";
                    return (65.0).toFixed(1) + "%";
                };

                const ollamaSigs = signals.filter(s => s.model && (s.model.toLowerCase().includes('ollama') || s.model.toLowerCase().includes('local')));

                document.getElementById("stat-ollama-winrate").innerText = calcSimulatedWinRate(ollamaSigs);
                document.getElementById("stat-ollama-a").innerText = calcSimulatedWinRate(ollamaSigs.filter(s => s.grade === 'A'));
                document.getElementById("stat-ollama-b").innerText = calcSimulatedWinRate(ollamaSigs.filter(s => s.grade === 'B'));
                document.getElementById("stat-ollama-c").innerText = calcSimulatedWinRate(ollamaSigs.filter(s => s.grade === 'C'));

                const calcMockPF = (sigs) => {
                    const entered = sigs.filter(s => s.result && s.result === 'entered');
                    if (entered.length === 0) return "--";
                    return "1.20"; 
                };
                document.getElementById("stat-ollama-pf").innerText = calcMockPF(ollamaSigs);
            }
         } catch (e) {
             console.error("Error loading analytics:", e);
         }
      }

      function initProfileLogic() {
        const defaultPairs = [
          { tvSymbol: "OANDA:XAUUSD", name: "XAUUSD (Gold Spot)", market: "Forex" },
          { tvSymbol: "BINANCE:BTCUSDT", name: "BTCUSD (Bitcoin)", market: "Crypto" },
          { tvSymbol: "BINANCE:ETHUSDT", name: "ETHUSD (Ethereum)", market: "Crypto" },
          { tvSymbol: "FX:EURUSD", name: "EURUSD (Euro)", market: "Forex" },
          { tvSymbol: "FX:GBPUSD", name: "GBPUSD (British Pound)", market: "Forex" },
          { tvSymbol: "FX:USDJPY", name: "USDJPY (Japanese Yen)", market: "Forex" }
        ];

        let list = JSON.parse(localStorage.getItem('custom_trading_symbols') || 'null');
        if (!list) list = defaultPairs;

        const tbody = document.getElementById('profile-symbols-table-body');
        if (tbody) {
          tbody.innerHTML = list.map((item, idx) => `
            <tr>
              <td style="text-align:left; font-weight:800; font-family:monospace; color:#60a5fa;">${item.tvSymbol}</td>
              <td style="text-align:left; font-weight:700; color:#fff;">${item.name}</td>
              <td style="text-align:left; font-size:12px; color:var(--text-muted);">${item.market}</td>
              <td style="text-align:center;">
                <button onclick="deleteProfileSymbol(${idx})" style="background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.3); color:#ef4444; border-radius:4px; padding:3px 10px; cursor:pointer; font-size:11px; font-weight:700;">🗑️ ลบ</button>
              </td>
            </tr>
          `).join('');
        }

        window.deleteProfileSymbol = function(idx) {
          list.splice(idx, 1);
          localStorage.setItem('custom_trading_symbols', JSON.stringify(list));
          initProfileLogic();
        };

        const addBtn = document.getElementById('profile-btn-add-symbol');
        if (addBtn) {
          addBtn.addEventListener('click', () => {
            const sym = prompt("ป้อนสัญลักษณ์ TradingView (เช่น BINANCE:SOLUSDT หรือ NASDAQ:NVDA):", "BINANCE:SOLUSDT");
            if (sym && sym.trim()) {
              const cleaned = sym.trim().toUpperCase();
              list.push({
                tvSymbol: cleaned,
                name: cleaned,
                market: cleaned.includes('BINANCE') ? 'Crypto' : 'Stocks/Forex'
              });
              localStorage.setItem('custom_trading_symbols', JSON.stringify(list));
              initProfileLogic();
            }
          });
        }
      }

                          html += `<tr style="border-bottom: 1px solid rgba(255,255,255,0.05); color:#cbd5e1; font-size:12px;">
                              <td style="padding: 6px 5px;">${h.iteration}</td>
                              <td style="padding: 6px 5px;">${h.params.sl_multiplier}</td>
                              <td style="padding: 6px 5px;">${h.params.rr_ratio}</td>
                              <td style="padding: 6px 5px; color:${h.stats?.win_rate >= 50 ? '#10b981' : '#ef4444'};">${h.stats?.win_rate || 0}%</td>
                              <td style="padding: 6px 5px; color:${h.stats?.total_profit >= 0 ? '#10b981' : '#ef4444'};">$${h.stats?.total_profit || 0}</td>
                          </tr>`;
                      });
                  }
                  html += `</tbody></table></div>`;
              }
              
              if (html === '') {
                  html = '<i>No valid results found.</i>';
              }
              
              container.innerHTML = html;
          })
          .catch(err => {
              container.innerHTML = `<div style="color: #ef4444;">❌ Error fetching results: ${err.message}</div>`;
          });
      };

// --- Training UI Logic ---
let trainingChart = null;
let trainingPollingInterval = null;
let lossData = [];
let labelsData = [];

function getTrainingHTML() {
    return `
        <div id="view-training" class="view" style="animation: fadeIn 0.3s ease;">
            <div class="header-container" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                <div>
                    <h2 class="header-title" style="text-align:left;">🧠 Local AI Training (Simulation)</h2>
                    <p style="color: #a1a1aa; font-size: 14px;">Fine-tune Llama 3 8B with Unsloth and LoRA adapters using your local trading journal data.</p>
                </div>
                <div>
                    <button class="btn btn-primary" id="btn-start-training" onclick="startAiTraining()">🚀 Start Training (Simulate)</button>
                </div>
            </div>

            <div class="card" style="margin-bottom: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <h3 style="margin:0; font-size: 16px;">Training Progress <span id="training-status-badge" style="font-size: 12px; padding: 3px 8px; border-radius: 12px; background: rgba(255,255,255,0.1); margin-left: 10px;">IDLE</span></h3>
                    <div id="training-metrics" style="font-size: 14px; color: #a1a1aa;">Epoch: <span id="train-epoch">0</span>/3 | Step: <span id="train-step">0</span>/0 | Loss: <span id="train-loss">N/A</span></div>
                </div>
                <div style="width: 100%; height: 10px; background: rgba(255,255,255,0.05); border-radius: 5px; overflow: hidden; margin-top: 15px;">
                    <div id="training-progress-bar" style="width: 0%; height: 100%; background: linear-gradient(90deg, #3b82f6, #8b5cf6); transition: width 0.3s ease;"></div>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="card" style="height: 400px; display: flex; flex-direction: column;">
                    <h3 style="margin-top:0; margin-bottom: 15px; font-size: 16px;">📉 Loss Performance Curve</h3>
                    <div style="flex-grow: 1; position: relative;">
                        <canvas id="trainingLossChart"></canvas>
                    </div>
                </div>
                
                <div class="card" style="height: 400px; display: flex; flex-direction: column;">
                    <h3 style="margin-top:0; margin-bottom: 15px; font-size: 16px;">💻 Terminal Console Log</h3>
                    <div id="training-console" style="flex-grow: 1; background: #0f172a; border-radius: 8px; padding: 15px; font-family: 'Courier New', Courier, monospace; font-size: 13px; color: #10b981; overflow-y: auto; border: 1px solid #334155;">
                        <div style="color: #64748b;">[System] Ready to start fine-tuning process.</div>
                        <div style="color: #64748b;">[System] Awaiting user command...</div>
                    </div>
                </div>
            </div>
        </div>
    `;
}

function initTrainingChart() {
    const ctx = document.getElementById('trainingLossChart');
    if (!ctx) return;
    
    if (trainingChart) {
        trainingChart.destroy();
    }
    
    trainingChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labelsData,
            datasets: [{
                label: 'Training Loss',
                data: lossData,
                borderColor: '#3b82f6',
                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                borderWidth: 2,
                pointRadius: 1,
                fill: true,
                tension: 0.3
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, title: { display: true, text: 'Loss' } },
                x: { grid: { display: false }, title: { display: true, text: 'Step' } }
            },
            plugins: { legend: { display: false } },
            animation: false
        }
    });
}

function startAiTraining() {
        const btn = document.getElementById("btn-start-training");
        if (btn.disabled) return;
        
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner" style="width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin 1s linear infinite;"></span> Running AI-Trader MCP...`;
        
        const term = document.getElementById("training-console");
        term.innerHTML = "[System] Initializing AI-Trader MCP Server...\n";
        
        let step = 0;
        const maxSteps = 20;
        
        const interval = setInterval(() => {
          step++;
          
          if (step === 2) {
             term.innerHTML += "[MCP] Connected to Claude Desktop.\n";
             term.innerHTML += "[Claude] Requesting backtest for CrossSMAStrategy...\n";
          }
          if (step === 4) {
             term.innerHTML += "[MCP] Generating YAML config...\n";
             term.innerHTML += "[MCP] Executing Backtrader Engine (ai-trader)...\n";
          }
          
          if (step > 4 && step < maxSteps) {
             const loss = Math.max(0.1, 2.0 - (step/maxSteps)*1.8 + (Math.random()*0.2)).toFixed(4);
             term.innerHTML += `[Backtrader] Eval step ${step}: Sharpe Ratio improving... Loss=${loss}
`;
             if (trainingChart) {
                trainingChart.data.labels.push(step);
                trainingChart.data.datasets[0].data.push(loss);
                trainingChart.update();
             }
          }
          
          if (step >= maxSteps) {
             clearInterval(interval);
             term.innerHTML += "[MCP] Optimization complete. Best YAML config saved.\n";
             term.innerHTML += "[System] AI-Trader execution finished.\n";
             btn.disabled = false;
             btn.innerHTML = "Start AI Optimization (Simulate)";
          }
          term.scrollTop = term.scrollHeight;
        }, 800);
      }

function pollTrainingStatus() {
    fetch(`http://${host}:19000/api/training/status`)
        .then(res => res.json())
        .then(data => {
            // Check if user is still on the training tab
            if (!document.getElementById('train-epoch')) return;

            // Update Metrics
            document.getElementById('train-epoch').innerText = data.current_epoch;
            document.getElementById('train-step').innerText = data.current_step;
            document.getElementById('train-loss').innerText = data.loss.toFixed(4);
            
            // Update Progress
            const progress = (data.current_step / data.total_steps) * 100;
            document.getElementById('training-progress-bar').style.width = `${progress}%`;
            
            // Update Chart
            if (data.is_training || data.current_step >= data.total_steps) {
                if (labelsData.length === 0 || labelsData[labelsData.length - 1] !== data.current_step) {
                    labelsData.push(data.current_step);
                    lossData.push(data.loss);
                    if (trainingChart) trainingChart.update();
                }
            }
            
            // Update Console
            const consoleDiv = document.getElementById('training-console');
            consoleDiv.innerHTML = '';
            data.logs.forEach(log => {
                consoleDiv.innerHTML += `<div><span style="color: #64748b;">[${log.time}]</span> ${log.msg}</div>`;
            });
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
            
            // Handle Completion
            if (!data.is_training && data.current_step >= data.total_steps && data.total_steps > 0) {
                clearInterval(trainingPollingInterval);
                const btn = document.getElementById('btn-start-training');
                btn.disabled = false;
                btn.innerHTML = '✅ Training Complete';
                document.getElementById('training-status-badge').innerText = 'COMPLETED';
                document.getElementById('training-status-badge').style.background = 'rgba(16, 185, 129, 0.2)';
                document.getElementById('training-status-badge').style.color = '#34d399';
            }
        })
        .catch(err => console.error(err));
}

}
