<!DOCTYPE html>
<html lang="th" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tawee Company — Trading Intelligence</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Standard CSS Styles -->
    <style>
      :root {
        --bg: #060913;
        --sidebar-bg: #0b0f19;
        --border-color: #1e293b;
        --text-muted: #64748b;
        --text-heading: #ffffff;
        --accent: #3b82f6;
        --accent-glow: rgba(59, 130, 246, 0.15);
      }
      
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      
      body {
        background-color: var(--bg);
        color: #f3f4f6;
        font-family: 'Inter', 'Prompt', sans-serif;
        font-size: 13px;
        height: 100vh;
        overflow: hidden;
        display: flex;
      }
      
      /* LAYOUT STRUCTURE */
      #app-container {
        display: flex;
        width: 100%;
        height: 100%;
      }
      
      /* SIDEBAR */
      aside#left-sidebar {
        width: 260px;
        background-color: var(--sidebar-bg);
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        height: 100%;
        overflow-y: auto;
      }
      
      aside#left-sidebar::-webkit-scrollbar {
        width: 4px;
      }
      aside#left-sidebar::-webkit-scrollbar-thumb {
        background-color: rgba(255, 255, 255, 0.05);
        border-radius: 2px;
      }
      
      /* Sidebar Brand Header */
      .brand-header {
        padding: 24px 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid rgba(30, 41, 59, 0.5);
      }
      
      .brand-logo {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: linear-gradient(135deg, #4aa3ff, #9a7bff);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        font-weight: 800;
        color: #ffffff;
        box-shadow: 0 0 16px -2px rgba(154, 123, 255, 0.5);
      }
      
      .brand-meta {
        display: flex;
        flex-direction: column;
      }
      
      .brand-title {
        font-size: 14px;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: 0.5px;
      }
      
      .brand-subtitle {
        font-size: 8px;
        font-weight: 700;
        color: var(--text-muted);
        letter-spacing: 1.5px;
        margin-top: 1px;
      }
      
      /* Sidebar Menu Groups */
      .menu-container {
        flex: 1;
        padding: 16px 12px;
      }
      
      .menu-group {
        margin-bottom: 20px;
      }
      
      .menu-group-title {
        font-size: 9px;
        font-weight: 700;
        color: var(--text-muted);
        letter-spacing: 1.2px;
        padding: 0 12px;
        margin-bottom: 6px;
        text-transform: uppercase;
      }
      
      .menu-item {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
        margin: 2px 0;
        border-radius: 8px;
        color: #94a3b8;
        background: transparent;
        border: 1px solid transparent;
        cursor: pointer;
        font-size: 12px;
        font-weight: 500;
        text-align: left;
        transition: all 0.15s ease;
      }
      
      .menu-item:hover {
        color: #ffffff;
        background-color: rgba(255, 255, 255, 0.03);
      }
      
      .menu-item-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      
      .menu-item-icon {
        width: 16px;
        text-align: center;
        font-size: 14px;
        color: var(--text-muted);
        display: inline-block;
        transition: color 0.15s;
      }
      
      .menu-item:hover .menu-item-icon {
        color: #ffffff;
      }
      
      .menu-item.active {
        color: #ffffff;
        background: linear-gradient(90deg, rgba(74, 163, 255, 0.12), rgba(154, 123, 255, 0.05));
        border: 1px solid rgba(255, 255, 255, 0.05);
        font-weight: 600;
      }
      
      .menu-item.active .menu-item-icon {
        color: #3b82f6;
      }
      
      .active-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background-color: #3b82f6;
        display: none;
      }
      
      .menu-item.active .active-dot {
        display: block;
      }
      
      /* Demo Badge */
      .badge-demo {
        font-size: 8px;
        font-weight: 700;
        background-color: rgba(139, 92, 246, 0.15);
        color: #a78bfa;
        padding: 2px 6px;
        border-radius: 4px;
        margin-right: 6px;
        letter-spacing: 0.5px;
      }
      
      /* Sidebar Status Card */
      .sidebar-footer {
        padding: 16px;
        border-top: 1px solid rgba(30, 41, 59, 0.5);
      }
      
      .status-card {
        background-color: rgba(6, 9, 19, 0.5);
        border: 1px solid rgba(30, 41, 59, 0.6);
        border-radius: 12px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      
      .status-card-header {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        font-weight: 700;
        color: #ffffff;
      }
      
      .status-dot-active {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #10b981;
        box-shadow: 0 0 8px #10b981;
      }
      
      .status-card-desc {
        font-size: 9.5px;
        color: var(--text-muted);
        line-height: 1.4;
      }
      
      /* DASHBOARD WORKSPACE STYLES */
      #dashboard-root {
        width: 100%;
        height: 100%;
        overflow-y: auto;
        background-color: var(--bg);
        display: flex;
        flex-direction: column;
        padding-bottom: 40px;
      }
      
      #dashboard-root::-webkit-scrollbar {
        width: 6px;
      }
      #dashboard-root::-webkit-scrollbar-thumb {
        background-color: rgba(255, 255, 255, 0.05);
        border-radius: 3px;
      }
      
      /* News Ticker Bar */
      .news-ticker-container {
        background-color: #0b0f19;
        border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        height: 32px;
        display: flex;
        align-items: center;
        overflow: hidden;
        position: relative;
        flex-shrink: 0;
      }
      
      .news-ticker-content {
        display: inline-block;
        white-space: nowrap;
        animation: ticker-scroll 35s linear infinite;
        padding-left: 100%;
        color: #f5c451;
        font-size: 11px;
        font-weight: 500;
      }
      
      @keyframes ticker-scroll {
        0% { transform: translate3d(0, 0, 0); }
        100% { transform: translate3d(-100%, 0, 0); }
      }
      
      /* Dashboard Header */
      .dashboard-header {
        padding: 14px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        flex-shrink: 0;
        gap: 16px;
      }
      
      .header-title-area {
        display: flex;
        flex-direction: column;
        gap: 2px;
        text-align: left;
      }
      
      .header-path {
        font-size: 9px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 700;
      }
      
      .header-title {
        font-size: 22px;
        font-weight: 800;
        color: #ffffff;
      }
      
      .header-right-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      
      .header-search-box {
        background-color: #0b101d;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        padding: 6px 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      
      .header-search-box input {
        background: transparent;
        border: none;
        outline: none;
        color: #ffffff;
        font-size: 12px;
        width: 180px;
        font-family: inherit;
      }
      
      .header-search-box input::placeholder {
        color: var(--text-muted);
      }
      
      .header-search-box kbd {
        background-color: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 4px;
        padding: 1px 5px;
        font-size: 10px;
        color: var(--text-muted);
        font-family: inherit;
      }
      
      .exchange-dropdown-wrapper {
        position: relative;
      }
      
      .exchange-btn {
        background-color: #0b101d;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        padding: 7px 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        color: #ffffff;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: border-color 0.15s;
        font-family: inherit;
      }
      
      .exchange-btn:hover {
        border-color: rgba(255, 255, 255, 0.2);
      }
      
      .ex-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
      }
      
      .ex-dot.ex-binance {
        background-color: #f5c451;
        box-shadow: 0 0 6px rgba(245, 196, 81, 0.5);
      }
      
      .ex-dot.ex-webull {
        background-color: #3b82f6;
        box-shadow: 0 0 6px rgba(59, 130, 246, 0.5);
      }
      
      .ex-dot.ex-mt5 {
        background-color: #a78bfa;
        box-shadow: 0 0 6px rgba(167, 139, 250, 0.5);
      }
      
      .exchange-dropdown-menu {
        position: absolute;
        right: 0;
        top: calc(100% + 6px);
        width: 220px;
        background-color: #0d1322;
        border: 1px solid #1e293b;
        border-radius: 12px;
        padding: 6px 0;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
        display: none;
        flex-direction: column;
        z-index: 200;
      }
      
      .exchange-dropdown-menu.show {
        display: flex;
      }
      
      .ex-option {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 9px 14px;
        cursor: pointer;
        font-size: 12px;
        color: #94a3b8;
        transition: all 0.15s;
      }
      
      .ex-option:hover {
        background-color: rgba(255, 255, 255, 0.04);
        color: #ffffff;
      }
      
      .ex-option.active {
        color: #ffffff;
        font-weight: 700;
      }
      
      .ex-status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: #f5c451;
      }
      
      .ex-footer {
        padding: 8px 14px 4px;
        border-top: 1px solid rgba(255, 255, 255, 0.04);
        font-size: 10px;
        color: #64748b;
        text-align: left;
      }
      
      .notification-wrapper {
        position: relative;
      }
      
      .bell-btn {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background-color: #0b101d;
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: #ffffff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        font-size: 14px;
        transition: border-color 0.15s;
      }
      
      .bell-btn:hover {
        border-color: rgba(255, 255, 255, 0.2);
      }
      
      .bell-badge {
        position: absolute;
        top: -4px;
        right: -4px;
        background-color: #3b82f6;
        color: #ffffff;
        border-radius: 50%;
        width: 17px;
        height: 17px;
        font-size: 9.5px;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid #060913;
      }
      
      .notif-dropdown-menu {
        position: absolute;
        right: 0;
        top: calc(100% + 6px);
        width: 360px;
        background-color: #0d1322;
        border: 1px solid #1e293b;
        border-radius: 14px;
        padding: 14px;
        box-shadow: 0 20px 48px rgba(0, 0, 0, 0.7);
        display: none;
        flex-direction: column;
        gap: 10px;
        z-index: 200;
      }
      
      .notif-dropdown-menu.show {
        display: flex;
      }
      
      .notif-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        font-weight: 700;
        color: #ffffff;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        padding-bottom: 10px;
      }
      
      .notif-sub-count {
        font-size: 10.5px;
        color: #64748b;
        font-weight: 500;
      }
      
      .notif-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      
      .notif-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background-color: rgba(255, 255, 255, 0.015);
        border: 1px solid rgba(255, 255, 255, 0.03);
        padding: 8px 10px;
        border-radius: 8px;
      }
      
      .notif-badge {
        font-size: 10px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 6px;
        white-space: nowrap;
      }
      
      .notif-badge.buy {
        background-color: rgba(16, 185, 129, 0.15);
        color: #10b981;
      }
      
      .notif-badge.sell {
        background-color: rgba(239, 68, 68, 0.15);
        color: #ef4444;
      }
      
      .notif-info {
        display: flex;
        flex-direction: column;
        gap: 2px;
        text-align: left;
        flex: 1;
        margin: 0 10px;
      }
      
      .notif-pair {
        font-size: 12px;
        font-weight: 700;
        color: #ffffff;
      }
      
      .notif-details {
        font-size: 10px;
        color: #94a3b8;
      }
      
      .notif-prob {
        font-size: 12px;
        font-weight: 800;
        color: #60a5fa;
      }
      
      .notif-footer-link {
        font-size: 11px;
        font-weight: 700;
        color: #3b82f6;
        text-align: center;
        padding-top: 6px;
        cursor: pointer;
        transition: color 0.15s;
      }
      
      .notif-footer-link:hover {
        color: #60a5fa;
      }
      
      .notif-disclaimer {
        font-size: 9px;
        color: #64748b;
        text-align: center;
      }
      
      .auth-btn {
        background: linear-gradient(135deg, #6366f1, #3b82f6);
        color: #ffffff;
        border: none;
        padding: 7px 14px;
        border-radius: 10px;
        font-size: 11.5px;
        font-weight: 700;
        cursor: pointer;
        transition: opacity 0.15s;
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
        font-family: inherit;
      }
      
      .auth-btn:hover {
        opacity: 0.9;
      }
      
      /* TRADING PAGE SPECIFIC STYLES */
      .pairs-selector-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        background-color: #0b0f19;
        border: 1px solid rgba(255, 255, 255, 0.03);
        border-radius: 12px;
        padding: 10px 16px;
      }
      
      .pairs-pills-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      
      .pair-pill {
        background-color: rgba(255, 255, 255, 0.02);
        color: var(--text-muted);
        border: 1px solid rgba(255, 255, 255, 0.04);
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.15s;
        font-family: inherit;
      }
      
      .pair-pill:hover {
        color: #ffffff;
        background-color: rgba(255, 255, 255, 0.06);
      }
      
      .pair-pill.active {
        background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(147, 51, 234, 0.2));
        color: #60a5fa;
        border-color: rgba(59, 130, 246, 0.4);
      }
      
      .tf-pills-list {
        display: flex;
        gap: 4px;
      }
      
      .tf-pill {
        background-color: rgba(255, 255, 255, 0.02);
        color: var(--text-muted);
        border: 1px solid rgba(255, 255, 255, 0.04);
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 10.5px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.15s;
        font-family: inherit;
      }
      
      .tf-pill:hover {
        color: #ffffff;
      }
      
      .tf-pill.active {
        background-color: #3b82f6;
        color: #ffffff;
        border-color: #3b82f6;
      }
      
      .tf-trend-badge {
        font-size: 11px;
        font-weight: 700;
        padding: 6px 14px;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      
      .tf-trend-badge.up {
        background-color: rgba(16, 185, 129, 0.12);
        color: #10b981;
        border: 1px solid rgba(16, 185, 129, 0.2);
      }
      
      .tf-trend-badge.down {
        background-color: rgba(239, 68, 68, 0.12);
        color: #ef4444;
        border: 1px solid rgba(239, 68, 68, 0.2);
      }
      
      /* SIGNALS HISTORY SPECIFIC STYLES */
      .signals-filter-bar {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        background-color: #0b0f19;
        border: 1px solid rgba(255, 255, 255, 0.03);
        border-radius: 12px;
        padding: 6px;
      }
      
      .signals-tf-btn {
        background: transparent;
        color: var(--text-muted);
        border: none;
        padding: 10px 16px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.15s;
        font-family: inherit;
        text-align: center;
      }
      
      .signals-tf-btn:hover {
        color: #ffffff;
        background-color: rgba(255, 255, 255, 0.03);
      }
      
      .signals-tf-btn.active {
        background: linear-gradient(135deg, #6366f1, #3b82f6);
        color: #ffffff;
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
      }
      
      .grade-badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 800;
        padding: 2px 8px;
        border-radius: 4px;
        color: #94a3b8;
        background-color: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      
      .grade-badge.a {
        color: #60a5fa;
        background-color: rgba(59, 130, 246, 0.15);
        border-color: rgba(59, 130, 246, 0.3);
      }

      .res-tag {
        font-size: 10.5px;
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 6px;
        display: inline-block;
      }
      
      .res-tag.skip {
        color: #f5c451;
        background-color: rgba(245, 196, 81, 0.1);
        border: 1px solid rgba(245, 196, 81, 0.25);
      }
      
      .res-tag.entered {
        color: #10b981;
        background-color: rgba(16, 185, 129, 0.12);
        border: 1px solid rgba(16, 185, 129, 0.25);
      }
      
      .refresh-icon-btn {
        background: transparent;
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 8px;
        padding: 4px 8px;
        cursor: pointer;
        color: var(--text-muted);
        transition: all 0.15s;
      }
      
      .refresh-icon-btn:hover {
        background: rgba(255,255,255,0.05);
        color: #ffffff;
      }
      
      /* AI ASSISTANT & SETTINGS SPECIFIC STYLES */
      .assistant-grid {
        display: grid;
        grid-template-columns: 260px 1fr;
        gap: 16px;
        min-height: 580px;
      }
      
      .assistant-sidebar {
        background-color: #0b0f19;
        border: 1px solid rgba(255, 255, 255, 0.03);
        border-radius: 12px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      
      .assistant-sidebar-title {
        font-size: 10px;
        font-weight: 800;
        color: var(--text-muted);
        letter-spacing: 1px;
        margin-bottom: 4px;
      }
      
      .quick-prompt-btn {
        background-color: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.04);
        color: #e2e8f0;
        border-radius: 8px;
        padding: 9px 12px;
        font-size: 11.5px;
        font-weight: 600;
        cursor: pointer;
        text-align: left;
        transition: all 0.15s;
        font-family: inherit;
      }
      
      .quick-prompt-btn:hover {
        background-color: rgba(99, 102, 241, 0.15);
        border-color: rgba(99, 102, 241, 0.3);
        color: #ffffff;
      }
      
      .assistant-chat-card {
        background-color: #0b0f19;
        border: 1px solid rgba(255, 255, 255, 0.03);
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      
      .assistant-chat-header {
        padding: 12px 18px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: rgba(255, 255, 255, 0.01);
      }
      
      .assistant-chat-body {
        flex: 1;
        padding: 18px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
        max-height: 440px;
        min-height: 380px;
      }
      
      .chat-bubble {
        display: flex;
        gap: 12px;
        max-width: 85%;
      }
      
      .chat-bubble.bot {
        align-self: flex-start;
      }

      function initPatternsLogic() {
         renderLivePatternMonitor();
         // Update every 3 seconds to keep it live
         if (window._patternInterval) clearInterval(window._patternInterval);
         window._patternInterval = setInterval(renderLivePatternMonitor, 3000);
      }

      function renderLivePatternMonitor() {
         const container = document.getElementById('pattern-monitor-grid');
         if (!container) return;
         
         const symbolsToWatch = ['XAUUSD', 'BTCUSD', 'ETHUSD', 'EURUSD', 'GBPUSD'];
         let html = '';
         
         symbolsToWatch.forEach(sym => {
            // Find latest signal for this symbol
            let pat = "ไม่มี (None)";
            let badgeStyle = "background:rgba(255,255,255,0.05); color:var(--text-muted); border:1px solid rgba(255,255,255,0.1);";
            let timeStr = "--";
            
            if (window.signalsHistory && window.signalsHistory.length > 0) {
                const latest = window.signalsHistory.find(s => s.symbol === sym);
                if (latest) {
                    if (latest.chart_pattern && latest.chart_pattern !== "None") {
                        pat = latest.chart_pattern;
                        // Color coding based on bullish/bearish
                        if (pat.includes("Bullish") || pat.includes("Uptrend")) {
                            badgeStyle = "background:rgba(16, 185, 129, 0.1); color:#10b981; border:1px solid rgba(16, 185, 129, 0.3);";
                        } else if (pat.includes("Bearish") || pat.includes("Downtrend")) {
                            badgeStyle = "background:rgba(239, 68, 68, 0.1); color:#ef4444; border:1px solid rgba(239, 68, 68, 0.3);";
                        } else {
                            badgeStyle = "background:rgba(252, 211, 77, 0.1); color:#fcd34d; border:1px solid rgba(252, 211, 77, 0.3);";
                        }
                    } else {
                        pat = "กำลังค้นหา... (None)";
                    }
                    
                    const dt = new Date(latest.timestamp * 1000);
                    timeStr = dt.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'});
                } else {
                    pat = "รอรับข้อมูล...";
                }
            } else {
                pat = "กำลังเชื่อมต่อ...";
            }
            
            html += `
              <div style="background:#0f172a; border-radius:8px; padding:16px; border:1px solid rgba(255,255,255,0.05);">
                 <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                    <div style="font-weight:700; font-size:14px; color:#fff;">${sym}</div>
                    <div style="font-size:10px; color:var(--text-muted);">อัปเดต: ${timeStr}</div>
                 </div>
                 <div style="font-size:12px; padding:6px 10px; border-radius:6px; text-align:center; font-weight:600; line-height:1.4; ${badgeStyle}">
                    ${pat}
                 </div>
              </div>
            `;
         });
         
         container.innerHTML = html;
      }

          };
        };
        
        root.querySelectorAll('[data-mon]').forEach(cv => {
          const key = cv.dataset.mon;
          monState[key] = {
            cv,
            g: cv.getContext("2d"),
            col: cv.dataset.color,
            data: Array.from({length: 40}, () => Math.random()),
            rnd: rng(key.length * 131 + 7)
          };
        });
        
        const monBase = {cpu: 45, mem: 68, net: 23, db: 91};
        const drawMon = () => {
          for (const k in monState) {
            const m = monState[k];
            const w = m.cv.width = m.cv.clientWidth * 2;
            const h = m.cv.height = 44;
            m.cv.style.height = "22px";
            m.data.push(m.data[m.data.length - 1] * 0.7 + m.rnd() * 0.3);
            m.data.shift();
            
            m.g.setTransform(2, 0, 0, 2, 0, 0);
            m.g.clearRect(0, 0, w / 2, h / 2);
            m.g.strokeStyle = m.col;
            m.g.lineWidth = 1.4;
            m.g.beginPath();
            
            const n = m.data.length;
            for (let i = 0; i < n; i++) {
              const x = (i / (n - 1)) * (w / 2);
              const y = 22 - 2 - m.data[i] * 18;
              if (i) m.g.lineTo(x, y);
              else m.g.moveTo(x, y);
            }
            m.g.stroke();
          }
          
          const j = (c) => Math.round(monBase[c] + (monState[c].data[39] - 0.5) * 6);
          const cpuBox = root.querySelector('#m-cpu');
          const memBox = root.querySelector('#m-mem');
          const netBox = root.querySelector('#m-net');
          const dbBox = root.querySelector('#m-db');
          
          if (cpuBox) cpuBox.textContent = j("cpu") + "%";
          if (memBox) memBox.textContent = j("mem") + "%";
          if (netBox) netBox.textContent = j("net") + "%";
          if (dbBox) dbBox.textContent = j("db") + "%";
        };

          trade_executor: ["Order #482910 Filled @ 2340.10", "MT5 Execution Time: 42ms", "Trailing Stop Active"]
        };

        // Cache character images
        const charImages = {};
        const getCharImage = (cid) => {
          if (!charImages[cid]) {
            const img = new Image();
            img.src = `assets/characters/char_${cid}.png`;
            charImages[cid] = img;
          }
          return charImages[cid];
        };

        const drawScene = () => {
          ctx.clearRect(0, 0, officeCanvas.width, officeCanvas.height);
          animTick += 0.05;
          
          const cw = officeCanvas.width;
          const ch = officeCanvas.height;

          // Camera Zoom & Offsets based on CAM selection
          const cfg = camConfigs[currentCam] || camConfigs["1"];
          ctx.save();
          ctx.translate(cw / 2 + cfg.ox, ch / 2 + cfg.oy);
          ctx.scale(cfg.zoom, cfg.zoom);
          ctx.translate(-cw / 2, -ch / 2);

          // 1. Dark Outer Floor Background
          ctx.fillStyle = "#0d131f";
          ctx.fillRect(0, 0, cw, ch);

          // Calculate Office Dimensions
          const startX = Math.max(20, (cw - 780) / 2);
          const startY = Math.max(20, (ch - 520) / 2);
          const roomW = 780; // For agent walking bounds
          const roomH = 520;
          
          // Helper to draw a room
          const drawRoom = (rx, ry, rw, rh, floorColor, borderColor) => {
             ctx.fillStyle = floorColor;
             ctx.fillRect(rx, ry, rw, rh);
             // Tile pattern
             ctx.strokeStyle = "rgba(255,255,255,0.05)";
             ctx.lineWidth = 1;
             for(let x=rx; x<rx+rw; x+=20) {
                 for(let y=ry; y<ry+rh; y+=20) {
                     ctx.strokeRect(x, y, 20, 20);
                 }
             }
             // Walls
             ctx.strokeStyle = borderColor;
             ctx.lineWidth = 6;
             ctx.strokeRect(rx, ry, rw, rh);
          };

          // 1. TOP-LEFT: Executive Workstations (Blue Tiled)
          const leftX = startX;
          const leftY = startY;
          drawRoom(leftX, leftY, 360, 240, "#365476", "#1e293b");
          
          // Desks in Workstation Room
          ctx.fillStyle = "#92400e";
          ctx.fillRect(leftX + 40, leftY + 50, 280, 24); // Top Desk row
          ctx.fillRect(leftX + 40, leftY + 150, 280, 24); // Bottom Desk row
          
          const drawComputer = (cx, cy) => {
              ctx.fillStyle = "#1e293b"; ctx.fillRect(cx, cy, 20, 16);
              ctx.fillStyle = "#0284c7"; ctx.fillRect(cx+2, cy+2, 16, 12);
              ctx.fillStyle = "#94a3b8"; ctx.fillRect(cx+4, cy+18, 12, 4);
          };
          // Computers on desks
          drawComputer(leftX + 70, leftY + 38); drawComputer(leftX + 160, leftY + 38); drawComputer(leftX + 250, leftY + 38);
          drawComputer(leftX + 70, leftY + 138); drawComputer(leftX + 160, leftY + 138); drawComputer(leftX + 250, leftY + 138);
          // Chairs
          ctx.fillStyle = "#334155";
          ctx.fillRect(leftX + 72, leftY + 80, 16, 14); ctx.fillRect(leftX + 162, leftY + 80, 16, 14); ctx.fillRect(leftX + 252, leftY + 80, 16, 14);
          ctx.fillRect(leftX + 72, leftY + 180, 16, 14); ctx.fillRect(leftX + 162, leftY + 180, 16, 14); ctx.fillRect(leftX + 252, leftY + 180, 16, 14);

          // 2. TOP-RIGHT: Boardroom (Purple Tiled)
          const rightX = startX + 400;
          const rightY = startY;
          drawRoom(rightX, rightY, 340, 240, "#6b21a8", "#1e293b");
          
          // Boardroom Table
          const bTableX = rightX + 80;
          const bTableY = rightY + 90;
          ctx.fillStyle = "#451a03";
          ctx.fillRect(bTableX, bTableY, 180, 70);
          drawComputer(bTableX + 30, bTableY - 12); drawComputer(bTableX + 130, bTableY - 12);
          drawComputer(bTableX + 30, bTableY + 54); drawComputer(bTableX + 130, bTableY + 54);
          // Chairs
          ctx.fillStyle = "#15803d";
          ctx.fillRect(bTableX + 30, bTableY - 24, 20, 12); ctx.fillRect(bTableX + 130, bTableY - 24, 20, 12);
          ctx.fillRect(bTableX + 30, bTableY + 82, 20, 12); ctx.fillRect(bTableX + 130, bTableY + 82, 20, 12);
          ctx.fillRect(bTableX - 16, bTableY + 25, 12, 20); ctx.fillRect(bTableX + 184, bTableY + 25, 12, 20);

          // 3. BOTTOM-LEFT: Server Room (Teal Tiled)
          const srvX = startX;
          const srvY = startY + 280;
          drawRoom(srvX, srvY, 200, 220, "#0f766e", "#1e293b");
          // Server Racks
          ctx.fillStyle = "#111827";
          ctx.fillRect(srvX + 20, srvY + 30, 40, 120);
          ctx.fillRect(srvX + 80, srvY + 30, 40, 120);
          ctx.fillRect(srvX + 140, srvY + 30, 40, 120);
          // Blinking lights on servers
          ctx.fillStyle = (animTick % 2 > 1) ? "#22c55e" : "#ef4444";
          ctx.fillRect(srvX + 25, srvY + 40, 5, 5); ctx.fillRect(srvX + 85, srvY + 40, 5, 5); ctx.fillRect(srvX + 145, srvY + 40, 5, 5);
          ctx.fillStyle = (animTick % 1.5 > 0.75) ? "#3b82f6" : "#22c55e";
          ctx.fillRect(srvX + 45, srvY + 60, 5, 5); ctx.fillRect(srvX + 105, srvY + 60, 5, 5); ctx.fillRect(srvX + 165, srvY + 60, 5, 5);
          ctx.fillStyle = "#eab308";
          ctx.fillRect(srvX + 25, srvY + 130, 5, 5); ctx.fillRect(srvX + 85, srvY + 130, 5, 5); ctx.fillRect(srvX + 145, srvY + 130, 5, 5);

          // 4. BOTTOM-MIDDLE: Lounge & Game Room (Magenta Tiled)
          const lngX = startX + 240;
          const lngY = startY + 280;
          drawRoom(lngX, lngY, 260, 220, "#be185d", "#1e293b");
          // Pool Table
          ctx.fillStyle = "#15803d"; ctx.fillRect(lngX + 50, lngY + 70, 160, 90);
          ctx.strokeStyle = "#78350f"; ctx.lineWidth=8; ctx.strokeRect(lngX + 50, lngY + 70, 160, 90);
          ctx.fillStyle = "#fbbf24"; ctx.fillRect(lngX + 20, lngY + 100, 100, 4); // Cue Stick
          ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(lngX+130, lngY+102, 5, 0, Math.PI*2); ctx.fill(); // Cue ball
          ctx.fillStyle = "#ef4444"; ctx.beginPath(); ctx.arc(lngX+150, lngY+95, 5, 0, Math.PI*2); ctx.fill(); // Red ball
          ctx.fillStyle = "#3b82f6"; ctx.beginPath(); ctx.arc(lngX+165, lngY+115, 5, 0, Math.PI*2); ctx.fill(); // Blue ball

          // 5. BOTTOM-RIGHT: Pantry / Kitchen (Orange/Brown Tiled)
          const kitX = startX + 540;
          const kitY = startY + 280;
          drawRoom(kitX, kitY, 200, 220, "#9a3412", "#1e293b");
          // Kitchen Counter
          ctx.fillStyle = "#e2e8f0";
          ctx.fillRect(kitX + 20, kitY + 20, 160, 35);
          // Fridge
          ctx.fillStyle = "#cbd5e1";
          ctx.fillRect(kitX + 150, kitY + 65, 30, 60);
          // Round Dining Table
          ctx.fillStyle = "#fde047";
          ctx.beginPath(); ctx.arc(kitX + 80, kitY + 140, 28, 0, Math.PI*2); ctx.fill();
          // Chairs at Dining Table
          ctx.fillStyle = "#0f172a";
          ctx.fillRect(kitX + 70, kitY + 95, 20, 12);
          ctx.fillRect(kitX + 70, kitY + 172, 20, 12);
          
          // 6. Draw Corridors (Grey Checkerboard) connecting the rooms
          const drawCorridor = (cx, cy, cw, ch) => {
             for(let x=cx; x<cx+cw; x+=16) {
                 for(let y=cy; y<cy+ch; y+=16) {
                     const isWhite = (Math.floor(x/16) + Math.floor(y/16)) % 2 === 0;
                     ctx.fillStyle = isWhite ? "#94a3b8" : "#475569";
                     ctx.fillRect(x, y, 16, 16);
                 }
             }
          };
          drawCorridor(startX + 360, startY + 80, 40, 80); // Corrdior between top rooms
          drawCorridor(startX + 200, startY + 350, 40, 60); // Corridor bottom left
          drawCorridor(startX + 500, startY + 350, 40, 60); // Corridor bottom right
          drawCorridor(startX + 150, startY + 240, 60, 40); // Vertical corridor left
          drawCorridor(startX + 550, startY + 240, 60, 40); // Vertical corridor right

          // 5. ANIMATED AGENTS & CHARACTER NAME LABELS
          // Room bounds mapping for agents
          const rooms = {
              'workspace': { minX: 40, maxX: 320, minY: 40, maxY: 200 },
              'boardroom': { minX: 440, maxX: 700, minY: 40, maxY: 200 },
              'server': { minX: 40, maxX: 160, minY: 320, maxY: 480 },
              'lounge': { minX: 280, maxX: 460, minY: 320, maxY: 480 },
              'pantry': { minX: 580, maxX: 700, minY: 320, maxY: 480 },
              'any': { minX: 40, maxX: 700, minY: 40, maxY: 480 }
          };

          if (!window.agentStateList) {
             window.agentStateList = [
                { key: 'supervisor', name: 'Supervisor AI (CEO)', ox: 170, oy: 110, cid: 1, accent: '#9a7bff', room: 'workspace' },
                { key: 'market_analyst', name: 'Market Analyst', ox: 70, oy: 100, cid: 17, accent: '#34d6e6', room: 'workspace' },
                { key: 'risk_manager', name: 'Risk Manager', ox: 160, oy: 100, cid: 26, accent: '#ffa24a', room: 'workspace' },
                { key: 'smc_strategy', name: 'SMC Strategist', ox: 250, oy: 100, cid: 29, accent: '#f5c451', room: 'workspace' },
                { key: 'news_analyst', name: 'News Analyst', ox: 70, oy: 200, cid: 21, accent: '#ff7eb6', room: 'workspace' },
                { key: 'trade_executor', name: 'Trade Executor', ox: 160, oy: 200, cid: 54, accent: '#37d27a', room: 'workspace' },
                { key: 'portfolio_manager', name: 'Portfolio Manager', ox: 250, oy: 200, cid: 57, accent: '#6a8dff', room: 'workspace' },
                { key: 'char_picker', name: 'Char Picker', ox: 380, oy: 260, cid: 77, accent: '#eab308', room: 'any' }
             ];
             window.agentStateList.forEach(a => {
                a.cx = a.ox; a.cy = a.oy;
                a.tx = a.ox; a.ty = a.oy;
             });
          }

          // Dynamically add new custom agents to the state list
          if (agentsData.length > window.agentStateList.length) {
             for (let i = window.agentStateList.length; i < agentsData.length; i++) {
               const a = agentsData[i];
               const newOx = 100 + ((i - 6) * 70) % (roomW * 2);
               window.agentStateList.push({
                 key: a.key, name: a.name, ox: newOx, oy: 320, cx: newOx, cy: 320, tx: newOx, ty: 320,
                 cid: a.charId, accent: '#38bdf8'
               });
             }
          }

          // Update Agent Positions (Walking Logic)
          window.agentStateList.forEach((ag, idx) => {
              const bounds = rooms[ag.room] || rooms['any'];
              
              // 0.5% chance to pick a new random spot in their specific room
              if (Math.random() < 0.005 && !ag.isWalking) {
                 ag.tx = bounds.minX + Math.random() * (bounds.maxX - bounds.minX);
                 ag.ty = bounds.minY + Math.random() * (bounds.maxY - bounds.minY);
              }
              // 1.0% chance to go back to their desk/origin (they prefer sitting at their desk)
              if (Math.random() < 0.010 && !ag.isWalking) {
                 ag.tx = ag.ox;
                 ag.ty = ag.oy;
              }
              
              const dx = ag.tx - ag.cx;
              const dy = ag.ty - ag.cy;
              const dist = Math.sqrt(dx*dx + dy*dy);
              
              if (dist > 1.5) {
                  ag.cx += (dx / dist) * 0.8; // Walking speed
                  ag.cy += (dy / dist) * 0.8;
                  ag.isWalking = true;
              } else {
                  ag.isWalking = false;
                  ag.cx = ag.tx;
                  ag.cy = ag.ty;
              }
              
              // Absolute positions
              ag.x = startX + ag.cx;
              ag.y = startY + ag.cy;
          });

          // Draw Agents (Sorted by Y so they overlap correctly)
          const sortedAgents = [...window.agentStateList].sort((a, b) => a.y - b.y);
          
          sortedAgents.forEach((ag, idx) => {
            const floatY = ag.isWalking ? (Math.sin(animTick * 12 + idx) * 3) : (Math.sin(animTick * 2 + idx) * 1.5);
            const ax = ag.x;
            const ay = ag.y + floatY;

            // Crop a single 16x32 frame from the character PNG spritesheet (facing front)
            const img = getCharImage(ag.cid);
            const frameIndex = ag.isWalking ? Math.floor((animTick * 5 + idx) % 4) : 0; // Animate when walking
            const sx = (frameIndex % 7) * 16;
            const sy = 0; // Row 0 = Facing front/down
            const sw = 16;
            const sh = 32;

            ctx.save();
            ctx.imageSmoothingEnabled = false; // Sharp pixel art rendering

            if (img && img.complete && img.naturalWidth > 0) {
              // Draw 2x scaled pixel character (32x64 pixels)
              ctx.drawImage(img, sx, sy, sw, sh, ax - 16, ay - 44, 32, 64);
            } else {
              // Fallback Pixel Head & Body
              ctx.fillStyle = ag.accent;
              ctx.fillRect(ax - 8, ay - 16, 16, 18);
              ctx.fillStyle = "#fde047";
              ctx.fillRect(ax - 6, ay - 32, 12, 14);
            }
            ctx.restore();

            // Draw Character Name Tag Label Below Character (Clear High-Contrast Text)
            ctx.save();
            ctx.font = "bold 11px Sarabun, Prompt, sans-serif";
            const labelText = ag.name;
            const tw = ctx.measureText(labelText).width;
            const tagX = ax - tw / 2 - 8;
            const tagY = ay + 20;
            const tagW = tw + 16;
            const tagH = 18;

            ctx.fillStyle = "#090d16";
            ctx.strokeStyle = ag.accent;
            ctx.lineWidth = 1.5;
            
            safeRoundRect(ctx, tagX, tagY, tagW, tagH, 4);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = "#ffffff";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(labelText, ax, tagY + 9);
            ctx.restore();

            // Animated Speech Bubble Above Character's Head
            const bubbleList = window.speechBubbles[ag.key] || ["Active & Monitoring Stream"];
            const bubbleIndex = Math.floor((animTick / 3 + idx) % bubbleList.length);
            const bubbleText = bubbleList[bubbleIndex];

            const bx = ax;
            const by = ay - 52;
            
            ctx.save();
            ctx.font = "bold 10px Sarabun, Prompt, sans-serif";
            const btw = ctx.measureText(`💬 ${bubbleText}`).width;
            const bX = bx - btw / 2 - 8;
            const bY = by - 10;
            const bW = btw + 16;
            const bH = 18;

            ctx.fillStyle = "#040711";
            ctx.strokeStyle = ag.accent;
            ctx.lineWidth = 1.5;
            
            safeRoundRect(ctx, bX, bY, bW, bH, 5);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = "#ffffff";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(`💬 ${bubbleText}`, bx, bY + 9);
            ctx.restore();
          });

          ctx.restore();
        };
        
        const loop = () => {
          if (officeCanvas.style.display !== 'none') {
            drawScene();
          }
          requestAnimationFrame(loop);
        };
        loop();
      }

      window.showFeatureHelp = function(featureKey, e) {

      window.sendTestNotification = function() {
        const tgToken = document.getElementById('set-tg-token')?.value || localStorage.getItem('notify_tg_token') || '';
        const tgChatId = document.getElementById('set-tg-chat-id')?.value || localStorage.getItem('notify_tg_chat_id') || '';
        const lineToken = document.getElementById('set-line-token')?.value || localStorage.getItem('notify_line_token') || '';

        const msgText = `🚨 [Tawee Company AI SMC Alert Test]\n⚡ ระบบแจ้งเตือนสัญญาณ AI SMC เชื่อมต่อสำเร็จเรียบร้อย!\n📈 XAUUSD (ทองคำ) - BUY Entry: 2,340.50 | SL: 2,332.00 | TP: 2,365.00 (Conf 89%)`;

        let alertCount = 0;

        // 1. Telegram Alert Dispatch
        if (tgToken && tgChatId) {
          alertCount++;
          fetch(`https://api.telegram.org/bot${tgToken}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: tgChatId, text: msgText })
          }).then(res => {
            if (res.ok) alert('✈️ ส่งแจ้งเตือนไปยัง Telegram เรียบร้อยแล้ว!');
            else alert('⚠️ Telegram ตอบกลับสถาณะ: ' + res.statusText);
          }).catch(err => alert('❌ Telegram Error: ' + err));
        }

        // 2. Line Notify Dispatch
        if (lineToken) {
          alertCount++;
          fetch('https://notify-api.line.me/api/notify', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/x-www-form-urlencoded',
              'Authorization': `Bearer ${lineToken}`
            },
            body: `message=${encodeURIComponent(msgText)}`
          }).then(res => {
            if (res.ok) alert('🟢 ส่งแจ้งเตือนไปยัง Line Notify เรียบร้อยแล้ว!');
            else alert('⚠️ Line Notify ตอบกลับสถาณะ: ' + res.statusText);
          }).catch(err => alert('❌ Line Notify Error: ' + err));
        }

        if (alertCount === 0) {
          alert('⚠️ กรุณากรอก Telegram Bot Token & Chat ID หรือ Line Notify Token ก่อนทดสอบส่งการแจ้งเตือนครับ');
        }
      };

      window.toggleExchangeMenu = function(e) {
        if (e) e.stopPropagation();
        const btn = document.getElementById('btn-exchange-select');
        const exMenu = document.getElementById('ex-menu');
        const notifMenu = document.getElementById('notif-menu');
        if (notifMenu) notifMenu.style.display = 'none';

        if (btn && exMenu) {
          const isShown = exMenu.style.display === 'block';
          if (isShown) {
            exMenu.style.display = 'none';
          } else {
            const rect = btn.getBoundingClientRect();
            exMenu.style.position = 'fixed';
            exMenu.style.top = (rect.bottom + 6) + 'px';
            exMenu.style.right = (window.innerWidth - rect.right) + 'px';
            exMenu.style.left = 'auto';
            exMenu.style.display = 'block';
            exMenu.style.zIndex = '999999999';
          }
        }
      };

      window.selectExchangeOption = function(name, dotClass, e) {
        if (e) e.stopPropagation();
        localStorage.setItem('selected_exchange', name);

        const nameEl = document.getElementById('selected-ex-name');
        const dotEl = document.getElementById('current-ex-dot');
        if (nameEl) nameEl.textContent = name;
        if (dotEl) dotEl.className = 'ex-dot ' + dotClass;

        const exMenu = document.getElementById('ex-menu');
        if (exMenu) {
          exMenu.style.display = 'none';
          const opts = exMenu.querySelectorAll('.ex-option');
          opts.forEach(o => {
            if (o.getAttribute('data-ex') === name) {
              o.classList.add('active');
            } else {
              o.classList.remove('active');
            }
          });
        }

        onMarketExchangeChanged(name);
      };

      window.selectNotifItem = function(pairName, e) {
        if (e) e.stopPropagation();
        const notifMenu = document.getElementById('notif-menu');
        if (notifMenu) notifMenu.style.display = 'none';

        const dashSelect = document.getElementById('dash-sym-select');
        if (dashSelect) {
          const matchingOpt = Array.from(dashSelect.options).find(o => o.value.includes(pairName) || o.text.includes(pairName));
          if (matchingOpt) {
            dashSelect.value = matchingOpt.value;
            dashSelect.dispatchEvent(new Event('change'));
          }
        }
      };

      document.addEventListener('click', () => {
        const exMenu = document.getElementById('ex-menu');
        const notifMenu = document.getElementById('notif-menu');
        if (exMenu) exMenu.style.display = 'none';
        if (notifMenu) notifMenu.style.display = 'none';
      });

             setTimeout(() => {
                 if (window.handleWsMessage) {
                     window.handleWsMessage({type: 'NEWS_UPDATE', ...window._kpiNews});
                 }
             }, 500);
         } catch(e) {}
      }

      // Initialize KPIs from localStorage
      window._kpiTotal = parseInt(localStorage.getItem('kpiTotal') || "522175");
      window._kpiToday = parseInt(localStorage.getItem('kpiToday') || "733");
      window._kpiReq = parseInt(localStorage.getItem('kpiReq') || "42");
      window._kpiWinRate = parseFloat(localStorage.getItem('kpiWinRate') || "25.9");
      window._kpiProfitFactor = parseFloat(localStorage.getItem('kpiProfitFactor') || "1.01");
      
      // Initialize AI Analysis from localStorage
      // Initialize AI Analysis from localStorage
      const cachedAi = localStorage.getItem('aiAnalysisStr');
      if (cachedAi) {
         try {
             window.aiDict = JSON.parse(cachedAi);
             setTimeout(() => {
                 if (window.updateDashAiAnalysis && window.signalsHistory) {
                     window.updateDashAiAnalysis(window.signalsHistory);
                 }
             }, 600);
         } catch(e) {}
      }

        initHeaderActionsLogic();
        const updateSessionStatus = () => {
          const now = new Date();
          const h = now.getHours();
          const m = now.getMinutes();
          
          const sessions = [
            { id: 'syd', start: 4, end: 13 },
            { id: 'tok', start: 7, end: 16 },
            { id: 'lon', start: 14, end: 23 },
            { id: 'ny', start: 18, end: 4 }
          ];
          
          sessions.forEach(s => {
            let isOpen = false;
            let hr = 0;
            
            if (s.start < s.end) {
              if (h >= s.start && h < s.end) {
                isOpen = true;
                hr = s.end - h - 1;
              } else {
                isOpen = false;
                if (h < s.start) {
                  hr = s.start - h - 1;
                } else {
                  hr = 24 - h + s.start - 1;
                }
              }
            } else {
              if (h >= s.start || h < s.end) {
                isOpen = true;
                if (h >= s.start) {
                  hr = 24 - h + s.end - 1;
                } else {
                  hr = s.end - h - 1;
                }
              } else {
                isOpen = false;
                hr = s.start - h - 1;
              }
            }
            
            const min = 59 - m;
            const dot = document.getElementById(s.id + "-dot");
            const label = document.getElementById(s.id + "-status");
            
            if (dot && label) {
              if (isOpen) {
                dot.style.backgroundColor = "#10b981";
                dot.style.boxShadow = "0 0 6px #10b981";
                label.textContent = `ปิดในอีก ${hr} ชม. ${min} น.`;
              } else {
                dot.style.backgroundColor = "#ff5c6c";
                dot.style.boxShadow = "0 0 6px #ff5c6c";
                label.textContent = `เปิดในอีก ${hr} ชม. ${min} น.`;
              }
            }
          });
        };
        
        const updateClocks = () => {
          const options = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
          
          const sydClock = document.getElementById("syd-clock");
          if (!sydClock) return; // if tab switched away, stop
          
          sydClock.textContent = new Date().toLocaleTimeString("en-US", { timeZone: "Australia/Sydney", ...options });
          document.getElementById("tok-clock").textContent = new Date().toLocaleTimeString("en-US", { timeZone: "Asia/Tokyo", ...options });
          document.getElementById("lon-clock").textContent = new Date().toLocaleTimeString("en-US", { timeZone: "Europe/London", ...options });
          document.getElementById("ny-clock").textContent = new Date().toLocaleTimeString("en-US", { timeZone: "America/New_York", ...options });
          
          updateSessionStatus();
        };
        
        const clockInterval = setInterval(updateClocks, 1000);
        updateClocks();
        
        // Cleanup interval if element is removed (tab switched)
        const checkCleanup = setInterval(() => {
          if (!document.getElementById("syd-clock")) {
            clearInterval(clockInterval);
            clearInterval(checkCleanup);
          }
        }, 2000);
        
        // Initialize Header Actions (Exchange Dropdown & Notification Bell)
        const btnEx = document.getElementById('btn-exchange-select');
        const exMenu = document.getElementById('ex-menu');
        const btnNotif = document.getElementById('btn-notif-bell');
        const notifMenu = document.getElementById('notif-menu');

        if (btnEx && exMenu) {
          btnEx.addEventListener('click', (e) => {
            e.stopPropagation();
            exMenu.classList.toggle('show');
            if (notifMenu) notifMenu.classList.remove('show');
          });

          const exOptions = exMenu.querySelectorAll('.ex-option');
          exOptions.forEach(opt => {
            opt.addEventListener('click', () => {
              exOptions.forEach(o => o.classList.remove('active'));
              opt.classList.add('active');
              const name = opt.getAttribute('data-ex');
              const dotClass = opt.getAttribute('data-class');
              
              const nameEl = document.getElementById('selected-ex-name');
              const dotEl = document.getElementById('current-ex-dot');
              if (nameEl) nameEl.textContent = name;
              if (dotEl) {
                dotEl.className = 'ex-dot ' + dotClass;
              }
              exMenu.classList.remove('show');
            });
          });
        }

        if (btnNotif && notifMenu) {
          btnNotif.addEventListener('click', (e) => {
            e.stopPropagation();
            notifMenu.classList.toggle('show');
            if (exMenu) exMenu.classList.remove('show');
          });
        }

        document.addEventListener('click', () => {
          if (exMenu) exMenu.classList.remove('show');
          if (notifMenu) notifMenu.classList.remove('show');
        });

        document.addEventListener('keydown', (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {

            const searchInput = document.getElementById('header-search-input');
            if (searchInput) searchInput.focus();
          }
        });

        function updateAiAnalysisCard(cleanSym) {
          const data = aiDict[cleanSym] || aiDict['XAUUSD'];
          const elSym = document.getElementById('ai-analysis-symbol');
          const elBias = document.getElementById('ai-analysis-bias');
          const elBullL = document.getElementById('ai-bullish-label');
          const elBearL = document.getElementById('ai-bearish-label');
          const elBullB = document.getElementById('ai-bullish-bar');
          const elNeuT = document.getElementById('ai-neu-text');
          const elMain = document.getElementById('ai-analysis-main');
          const elStruct = document.getElementById('ai-analysis-struct');
            const elPattern = document.getElementById('ai-analysis-pattern');
          const elRec = document.getElementById('ai-analysis-rec');

          if (elSym) elSym.textContent = data.symText;
          if (elBias) elBias.textContent = data.biasText;
          if (elBullL) elBullL.textContent = `Bullish ${data.bullPct}`;
          if (elBearL) elBearL.textContent = `Bearish ${data.bearPct}`;
          if (elBullB) elBullB.style.width = data.bullPct;
          if (elNeuT) elNeuT.textContent = data.neuText;
          if (elMain) elMain.textContent = data.mainText;
          if (elStruct) elStruct.textContent = data.structText;
          if (elRec) elRec.textContent = data.recText;
        }

        // Initial load TradingView
        loadTvWidget(currentSymbol, currentInterval);

        // Symbol Selector Change Handler
        const symSelect = document.getElementById('dash-sym-select');
        if (symSelect) {
          symSelect.addEventListener('change', (e) => {
            currentSymbol = e.target.value;
            const cleanSym = currentSymbol.split(':').pop().replace('USDT', 'USD');
            
            const mainSubTitle = document.getElementById('dash-sym-sub');
            const subTitle = document.getElementById('dash-chart-sub');
            if (mainSubTitle) {
              mainSubTitle.textContent = `${cleanSym} · เลื่อน/ซูมได้`;
            }
            if (subTitle) {
              const activeTfEl = document.querySelector('.chart-tf-pill[data-tf].active');
              const tfText = activeTfEl ? activeTfEl.textContent.trim() : 'M5';
              subTitle.textContent = `${currentSymbol} - ${tfText} — สัญญาณวิเคราะห์เรียลไทม์ —`;
            }
            
            updateAiAnalysisCard(cleanSym);
            loadTvWidget(currentSymbol, currentInterval);
          });
        }

        // Timeframe Pills Click Handler (H1, M15, M5, M1)
        const tfPills = document.querySelectorAll('.chart-tf-pill[data-tf]');
        tfPills.forEach(pill => {
          pill.addEventListener('click', () => {
            tfPills.forEach(p => p.classList.remove('active'));
            pill.classList.add('active');
            
            currentInterval = pill.getAttribute('data-tf');
            const tfLabel = pill.textContent.trim();
            
            const subTitle = document.getElementById('dash-chart-sub');
            if (subTitle) {
              subTitle.textContent = `${currentSymbol} - ${tfLabel} — สัญญาณวิเคราะห์เรียลไทม์ —`;
            }
            
            loadTvWidget(currentSymbol, currentInterval);
          });
        });

        // SMC Overlay Mode Pills Handler (< P/D, < OTE, < Vol)
        const modePills = document.querySelectorAll('.chart-tf-pill[data-mode]');
        modePills.forEach(pill => {
          pill.addEventListener('click', () => {
            pill.classList.toggle('active');
            const mode = pill.getAttribute('data-mode');
            const overlayLayer = document.getElementById('ai-chart-overlay-layer');
            if (overlayLayer) {
              if (mode === 'pd') {
                const supplyBands = overlayLayer.querySelectorAll('.ai-overlay-band');
                supplyBands.forEach(b => b.style.opacity = pill.classList.contains('active') ? '1' : '0.2');
              } else if (mode === 'ote') {
                const fibTags = overlayLayer.querySelectorAll('.tag-fib, .tag-mss');
                fibTags.forEach(t => t.style.opacity = pill.classList.contains('active') ? '1' : '0.2');
              } else if (mode === 'vol') {
                const bslTags = overlayLayer.querySelectorAll('.tag-bsl, .tag-ssl');
                bslTags.forEach(t => t.style.opacity = pill.classList.contains('active') ? '1' : '0.2');
              }
            }
          });
        });

        // Mode Switching (TradingView Live vs AI Zones Overlay)
        const btnTv = document.getElementById('btn-chart-mode-tv');
        const btnAi = document.getElementById('btn-chart-mode-ai');
        const aiContainer = document.getElementById('ai-zones-container');

        if (btnTv && btnAi && aiContainer) {
          btnTv.addEventListener('click', () => {
            btnTv.classList.add('active');
            btnAi.classList.remove('active');
            tvContainer.style.display = 'block';
            aiContainer.style.display = 'none';
          });

          btnAi.addEventListener('click', () => {
            btnAi.classList.add('active');
            btnTv.classList.remove('active');
            tvContainer.style.display = 'none';
            aiContainer.style.display = 'block';
            if (!aiContainer.querySelector('canvas')) {
              initAiZonesLightweightChart(aiContainer);
            }
          });
        }
      }

      function initAiZonesLightweightChart(chartContainer) {
        if (!chartContainer) return;
        
        const chart = LightweightCharts.createChart(chartContainer, {
          layout: {
            background: { type: 'solid', color: 'transparent' },
            textColor: '#7c889f',
          },
          grid: {
            vertLines: { color: 'rgba(255, 255, 255, 0.02)' },
            horzLines: { color: 'rgba(255, 255, 255, 0.02)' },
          },
          crosshair: {
            mode: LightweightCharts.CrosshairMode.Normal,
          },
          rightPriceScale: {
            borderColor: 'rgba(255, 255, 255, 0.05)',
          },
          timeScale: {
            borderColor: 'rgba(255, 255, 255, 0.05)',
            timeVisible: true,
          },
        });
        
        const candlestickSeries = chart.addCandlestickSeries({
          upColor: '#10b981',
          downColor: '#ef4444',
          borderVisible: false,
          wickUpColor: '#10b981',
          wickDownColor: '#ef4444',
        });
        
        const data = [];
        let time = new Date(Date.now() - 100 * 5 * 60 * 1000);
        let price = 2335;
        for (let i = 0; i < 100; i++) {
          const open = price;
          const close = price + (Math.random() - 0.48) * 3;
          const high = Math.max(open, close) + Math.random() * 2;
          const low = Math.min(open, close) - Math.random() * 2;
          
          data.push({
            time: Math.floor(time.getTime() / 1000),
            open,
            high,
            low,
            close
          });
          price = close;
          time = new Date(time.getTime() + 5 * 60 * 1000);
        }
        
        candlestickSeries.setData(data);
        
        candlestickSeries.createPriceLine({
          price: 2355.20,
          color: '#ef4444',
          lineWidth: 1,
          lineStyle: LightweightCharts.LineStyle.Dotted,
          axisLabelVisible: true,
          title: 'BSL 4023.88',
        });
        
        candlestickSeries.createPriceLine({
          price: 2331.10,
          color: '#10b981',
          lineWidth: 1,
          lineStyle: LightweightCharts.LineStyle.Dotted,
          axisLabelVisible: true,
          title: 'SSL 4009.19',
        });
        
        candlestickSeries.createPriceLine({
          price: 2348.50,
          color: '#f5c451',
          lineWidth: 1.5,
          lineStyle: LightweightCharts.LineStyle.Dashed,
          axisLabelVisible: true,
          title: 'BOS bull 4016.57',
        });
        
        candlestickSeries.createPriceLine({
          price: 2341.20,
          color: '#f5c451',
          lineWidth: 1,
          lineStyle: LightweightCharts.LineStyle.Dotted,
          axisLabelVisible: true,
          title: 'FIB 0.618 3999.23',
        });

        candlestickSeries.createPriceLine({
          price: 2338.50,
          color: '#ffa24a',
          lineWidth: 1,
          lineStyle: LightweightCharts.LineStyle.Dotted,
          axisLabelVisible: true,
          title: 'FIB 0.5 3991.62',
        });
        
        chart.timeScale().fitContent();
        
        const handleResize = () => {
          if (!document.body.contains(chartContainer)) return;
          if (chartContainer.clientWidth > 0 && chartContainer.clientHeight > 0) {
              chart.applyOptions({
                width: chartContainer.clientWidth,
                height: chartContainer.clientHeight
              });
          }
        };
        
        window.addEventListener('resize', handleResize);
        handleResize();
      }

      async function exportResearchData() {
        const btn = document.getElementById("btn-export-research-analytics") || document.getElementById("btn-export-research");
        const originalText = btn ? btn.innerHTML : "ส่งออกข้อมูล CSV";
        if (btn) {
            btn.innerHTML = "⏳ กำลังส่งออกข้อมูล...";
            btn.disabled = true;
        }
        
        try {
            const qp = new URLSearchParams(window.location.search); const host = '192.168.0.41';
            const res = await fetch(`http://${host}:19000/api/export_research_data`);
            if (res.ok) {
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = "research_signals_export.csv";
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);
                alert("ระบบสำเร็จ: ส่งออกไฟล์ CSV สำหรับงานวิจัยเรียบร้อยแล้ว");
            } else {
                alert("เกิดข้อผิดพลาด: ไม่สามารถส่งออกข้อมูลได้");
            }
        } catch (e) {
            console.error(e);
            alert("เกิดข้อผิดพลาด: การเชื่อมต่อกับเซิร์ฟเวอร์ล้มเหลว");
        } finally {
            if (btn) {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
      }

        window.updateDashAiAnalysis = function(history) {
            // Find most recent signal to populate AI Analysis card
            if(!history || history.length === 0) return;
            const recent = history[0];
            
            const elSym = document.getElementById('ai-analysis-symbol');
            const elBias = document.getElementById('ai-analysis-bias');
            const elBullL = document.getElementById('ai-bullish-label');
            const elBearL = document.getElementById('ai-bearish-label');
            const elBullB = document.getElementById('ai-bullish-bar');
            const elNeuT = document.getElementById('ai-neu-text');
            const elMain = document.getElementById('ai-analysis-main');
            const elStruct = document.getElementById('ai-analysis-struct');
            const elPattern = document.getElementById('ai-analysis-pattern');
            const elRec = document.getElementById('ai-analysis-rec');
            
            if(elSym) elSym.textContent = recent.symbol;
            
            let isBuy = (recent.type || recent.side) === "BUY";
            let conf = parseInt(recent.confidence || 80);
            
            if(elBias) elBias.textContent = isBuy ? "เอนขาขึ้น (Bullish)" : "เอนขาลง (Bearish)";
            
            let bullPct = isBuy ? conf : (100 - conf - 10);
            let bearPct = isBuy ? (100 - conf - 10) : conf;
            if(bullPct < 0) bullPct = 0;
            if(bearPct < 0) bearPct = 0;
            let neuPct = 100 - bullPct - bearPct;
            
            if (elBullL) elBullL.textContent = `Bullish ${bullPct}%`;
            if (elBearL) elBearL.textContent = `Bearish ${bearPct}%`;
            if (elBullB) elBullB.style.width = `${bullPct}%`;
            if (elNeuT) elNeuT.textContent = `= ${neuPct}%`;
            
            if (elMain) elMain.textContent = `${isBuy ? 'Bullish' : 'Bearish'} ${conf}% (${isBuy ? 'เอนขาขึ้น' : 'เอนขาลง'})`;
            if (elStruct) elStruct.textContent = recent.reason || `พบสัญญาณ ${recent.grade || 'A'} ในตลาด`;
            if (elPattern) elPattern.textContent = (recent.chart_pattern && recent.chart_pattern !== "None") ? `📈 ${recent.chart_pattern}` : "ไม่มี (None)";

            if (elRec) elRec.textContent = `แนะนำให้เปิดออเดอร์ ${isBuy ? 'BUY' : 'SELL'} แถวราคา ${recent.entry || recent.price}`;
        };

        window.renderSignalsTable = function(history) {
            window.signalsHistory = history;
            const now = Date.now() / 1000;
            const cutoff = now - (window.activeDaysFilter * 86400);
            
            const filtered = history.filter(item => item.timestamp >= cutoff);
            
            const subTitle = document.getElementById('signals-count-subtitle');
            if (subTitle) {
                subTitle.textContent = `${filtered.length} รายการ · รวม re-check ต่อเนื่องเป็น 1 สัญญาณ`;
            }
            
            renderRows(filtered);
        };

        function renderRows(items) {
          tbody.innerHTML = items.map(item => `
            <tr>
              <td style="color:#94a3b8; font-size:12px; font-weight:500;">${item.time}</td>
              <td><b style="color:#ffffff; font-size:12.5px;">${item.symbol}</b></td>
              <td>
                <span class="notif-badge ${item.type.toLowerCase()}" style="font-size:10.5px; padding:3px 10px;">
                  ${item.type === 'BUY' ? '▲ BUY' : '▼ SELL'}
                </span>
              </td>
              <td>
                <span class="grade-badge ${item.grade.toLowerCase()}">${item.grade}</span>
              </td>
              <td style="color:#94a3b8; font-size:12px;">${item.duration}</td>
              <td>
                <span class="res-tag ${item.result}">${item.resultText}</span>
              </td>
            </tr>
          `).join('');
        }

        // Wait for WebSocket data to call renderSignalsTable

        // Day Filter Buttons
        const dayBtns = document.querySelectorAll('#signals-day-filters .signals-tf-btn');
        dayBtns.forEach(btn => {
          btn.addEventListener('click', () => {
            dayBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const days = parseInt(btn.getAttribute('data-days') || "14", 10);
            window.activeDaysFilter = days;
            
            if (window.signalsHistory) {
                window.renderSignalsTable(window.signalsHistory);
            }
          });
        });

        // Search Input Filter
        const searchInput = document.getElementById('signals-search-input');
        if (searchInput) {
          searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (!query) {
              renderRows(mockData);
            } else {
              const filtered = mockData.filter(d => 
                d.pair.toLowerCase().includes(query) || 
                d.side.toLowerCase().includes(query) ||
                d.grade.toLowerCase().includes(query) ||
                d.resultText.toLowerCase().includes(query)
              );
              renderRows(filtered);
            }
          });
        }
      }

      function initAssistantLogic() {
        const btnModel = document.getElementById('btn-model-select');
        const modelMenu = document.getElementById('model-menu');
        const labelModel = document.getElementById('selected-model-label');
        const chatModelTag = document.getElementById('active-chat-model-name');
        
        let currentModel = localStorage.getItem('active_ai_model') || 'Copilot (Default)';
        if (labelModel) labelModel.textContent = currentModel;
        if (chatModelTag) chatModelTag.textContent = `· โมเดลปัจจุบัน: ${currentModel}`;

        if (btnModel && modelMenu) {
          btnModel.addEventListener('click', (e) => {
            e.stopPropagation();
            modelMenu.classList.toggle('show');
          });

          const options = modelMenu.querySelectorAll('.ex-option');
          options.forEach(opt => {
            opt.addEventListener('click', () => {
              options.forEach(o => o.classList.remove('active'));
              opt.classList.add('active');
              
              currentModel = opt.getAttribute('data-model');
              localStorage.setItem('active_ai_model', currentModel);
              
              if (labelModel) labelModel.textContent = currentModel;
              if (chatModelTag) chatModelTag.textContent = `· โมเดลปัจจุบัน: ${currentModel}`;
              
              modelMenu.classList.remove('show');
            });
          });
        }

        const chatBox = document.getElementById('assistant-chat-box');
        const inputField = document.getElementById('assistant-input-field');
        const sendBtn = document.getElementById('btn-send-message');

        function appendMessage(sender, text) {
          if (!chatBox) return;
          const bubble = document.createElement('div');
          bubble.className = `chat-bubble ${sender}`;
          
          const avatar = document.createElement('div');
          avatar.className = 'chat-avatar';
          avatar.textContent = sender === 'user' ? '👤' : '🤖';

          const content = document.createElement('div');
          content.className = 'chat-content';
          content.innerHTML = text;

          bubble.appendChild(avatar);
          bubble.appendChild(content);
          chatBox.appendChild(bubble);

          chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleUserSubmit(userText) {
          if (!userText || !userText.trim()) return;
          const text = userText.trim();
          appendMessage('user', text);
          if (inputField) inputField.value = '';

          // Simulated AI Typing delay
          setTimeout(() => {
            let aiResponse = generateAIResponse(text, currentModel);
            appendMessage('bot', aiResponse);
          }, 500);
        }

        if (sendBtn) {
          sendBtn.addEventListener('click', () => {
            if (inputField) handleUserSubmit(inputField.value);
          });
        }

        if (inputField) {
          inputField.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
              handleUserSubmit(inputField.value);
            }
          });
        }

        const quickBtns = document.querySelectorAll('.quick-prompt-btn');
        quickBtns.forEach(b => {
          b.addEventListener('click', () => {
            const promptText = b.getAttribute('data-prompt');
            handleUserSubmit(promptText);
          });
        });

        const clearBtn = document.getElementById('btn-clear-chat');
        if (clearBtn && chatBox) {
          clearBtn.addEventListener('click', () => {
            chatBox.innerHTML = `
              <div class="chat-bubble bot">
                <div class="chat-avatar">🤖</div>
                <div class="chat-content">
                  <b>ล้างประวัติการแชทแล้ว ✨</b><br>
                  คุณสามารถพิมพ์คำถามใหม่ได้ทันทีครับ! (โมเดลปัจจุบัน: <b>${currentModel}</b>)
                </div>
              </div>
            `;
          });
        }
      }

            const lineToken = document.getElementById('set-line-token').value;

            // Marquee
            const marqueeText = document.getElementById('set-marquee-text').value;

            // Save to localStorage
            localStorage.setItem('api_key_binance', binanceKey);
            localStorage.setItem('api_secret_binance', binanceSecret);
            localStorage.setItem('api_token_set', setToken);
            localStorage.setItem('acc_id_set', setAccId);

            // Update live marquee
            const previewMarquee = document.getElementById('settings-marquee-preview');

                alertTag.style.display = 'none';
              }, 3000);

          });
        }

      window.selectThemePreset = function(themeName) {
        localStorage.setItem('app_theme', themeName);
        applyAppTheme(themeName);
        const tag = document.getElementById('theme-active-tag');
        if (tag) tag.textContent = themeName;
        const selectEl = document.getElementById('set-app-theme');
        if (selectEl) selectEl.value = themeName;
      };

      function applyAppTheme(theme) {
        const root = document.documentElement;
        if (theme === 'Neon Cyberpunk') {
          root.style.setProperty('--bg', '#0b0518');
          root.style.setProperty('--sidebar-bg', '#130a2a');
          root.style.setProperty('--border-color', '#2e1065');
          root.style.setProperty('--accent', '#a855f7');
          root.style.setProperty('--accent-glow', 'rgba(168, 85, 247, 0.2)');
        } else if (theme === 'Midnight Blue') {
          root.style.setProperty('--bg', '#060e20');
          root.style.setProperty('--sidebar-bg', '#0d1b38');
          root.style.setProperty('--border-color', '#1e3a8a');
          root.style.setProperty('--accent', '#38bdf8');
          root.style.setProperty('--accent-glow', 'rgba(56, 189, 248, 0.2)');
        } else if (theme === 'Emerald Trader') {
          root.style.setProperty('--bg', '#04120c');
          root.style.setProperty('--sidebar-bg', '#0a2016');
          root.style.setProperty('--border-color', '#064e3b');
          root.style.setProperty('--accent', '#10b981');
          root.style.setProperty('--accent-glow', 'rgba(16, 185, 129, 0.2)');
        } else { // Dark Obsidian Default
          root.style.setProperty('--bg', '#060913');

          root.style.setProperty('--accent-glow', 'rgba(59, 130, 246, 0.15)');
        }
      }

      // Apply initial theme on load
