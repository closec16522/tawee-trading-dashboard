            localStorage.setItem('api_telegram_chatid', tgChat);
            localStorage.setItem('api_line_token', lineTok);

            alert("💾 บันทึกการตั้งค่าทั้งหมดสำเร็จ! ข้อความประกาศวิ่ง และค่า API Key ได้รับการอัปเดตแล้ว");
            initSettingsLogic();
          });
        }
      }

      // --- MT5 WebSockets Integration ---
      const queryParams = new URLSearchParams(window.location.search);
      const host = queryParams.get("gw") || "127.0.0.1";
      const wsUrl = `ws://${host}:19000/ws`;
      const connectMT5Gateway = () => {
        const ws = new WebSocket(wsUrl);
        const logContainer = document.getElementById("live-log-container");
        
        const appendLog = (msg, color="#38bdf8") => {
          if(!logContainer) return;
          const div = document.createElement("div");
          div.style.color = color;
          const now = new Date();
          const timeStr = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0') + ":" + now.getSeconds().toString().padStart(2, '0');
          div.innerText = `[${timeStr}] ${msg}`;
          logContainer.appendChild(div);
          logContainer.scrollTop = logContainer.scrollHeight;
        };

        ws.onopen = () => {
          if(logContainer) logContainer.innerHTML = "";
          appendLog(`[GATEWAY] Connected to WebSocket at ${wsUrl}`, "#37d27a");
          
          // update UI tags
          const gwTag = document.querySelector(".tag");
          if(gwTag) {
              gwTag.innerHTML = "🟢 WS CONNECTED";
          }
        };
        
        ws.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.type === "MT5_UPDATE") {
               // Update KPIs
               const kpiOnline = document.getElementById("kpi-online");
               if (kpiOnline && window.agentStateList) {
                   kpiOnline.innerText = window.agentStateList.length;
               }
               const kpiSys = document.getElementById("kpi-system-status");
               if (kpiSys) {
                   kpiSys.innerHTML = "🟢 ปกติ";
                   kpiSys.style.color = "#10b981";
               }
               
               if(data.account) {
                  const eqEl = document.getElementById("kpi-equity");
                  if(eqEl && data.account.equity !== undefined) {
                      eqEl.innerText = "$" + parseFloat(data.account.equity).toLocaleString(undefined, {minimumFractionDigits: 2});
                  }
                  const dpEl = document.getElementById("kpi-today-pl");
                  if(dpEl && data.account.profit !== undefined) {
                      dpEl.innerText = (data.account.profit >= 0 ? "+$" : "-$") + Math.abs(data.account.profit).toLocaleString(undefined, {minimumFractionDigits: 2});
                      dpEl.style.color = data.account.profit >= 0 ? "#10b981" : "#ef4444";
                  }
               }
               
               // Mock updates for Win Rate and Profit Factor slightly for realism
               const wrEl = document.getElementById("kpi-winrate");
               if(wrEl && Math.random() < 0.05) {
                   let curWr = parseFloat(wrEl.innerText);
                   curWr += (Math.random() * 2 - 1);
                   if(curWr > 100) curWr = 100;
                   if(curWr < 0) curWr = 0;
                   wrEl.innerText = curWr.toFixed(1) + "%";
                   wrEl.style.color = curWr >= 50 ? "#10b981" : "#ef4444";
               }
               const pfEl = document.getElementById("kpi-profit-factor");
               if(pfEl && Math.random() < 0.05) {
                   let curPf = parseFloat(pfEl.innerText);
                   curPf += (Math.random() * 0.1 - 0.05);
                   if(curPf < 0) curPf = 0.1;
                   pfEl.innerText = curPf.toFixed(2);
                   pfEl.style.color = curPf >= 1.0 ? "#10b981" : "#ef4444";
               }
               
               // Update Open Positions
               if(data.positions) {
                   const formatCurrency = (val) => {
                       return (val >= 0 ? "+$" : "-$") + Math.abs(val).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
                   };
                   
                   let html = "";
                   data.positions.forEach(p => {
                       const plColor = p.profit >= 0 ? "#10b981" : "#ef4444";
                       const sideClass = p.type === "BUY" ? "side BUY" : "side SELL";
                       html += `<tr>
                           <td><b>${p.symbol}</b></td>
                           <td><span class="${sideClass}">${p.type}</span></td>
                           <td>${p.volume}</td>
                           <td>${p.price_open}</td>
                           <td>${p.price_current}</td>
                           <td><span style="color:${plColor}; font-weight:700;">${formatCurrency(p.profit)}</span></td>
                       </tr>`;
                   });
                   
                   const posCount = data.positions.length;
                   
                   const dbTbody = document.getElementById("dash-pos-tbody");
                   if (dbTbody) dbTbody.innerHTML = html;
                   const dbTitle = document.getElementById("dash-pos-title");
                   if (dbTitle) dbTitle.innerText = `Open Positions (${posCount} ออเดอร์กำลังรัน)`;
                   
                   const trTbody = document.getElementById("trade-pos-tbody");
                   if (trTbody) trTbody.innerHTML = html;
                   const trTitle = document.getElementById("trade-pos-title");
                   if (trTitle) trTitle.innerText = `● ${posCount} Active Orders`;
                   
                   const tsTbody = document.getElementById("trades-pos-tbody");
                   if (tsTbody) tsTbody.innerHTML = html;
                   const tsTitle = document.getElementById("trades-pos-title");
                   if (tsTitle) tsTitle.innerText = `Open Positions (${posCount})`;
                   
                   // --- Update Right Panel (Live Trades) ---
                   const liveTradesEl = document.getElementById("live-trades");
                   const openCountEl = document.getElementById("open-count");
                   if (openCountEl) openCountEl.innerText = `${posCount} OPEN`;
                   if (liveTradesEl) {
                       let ltHtml = "";
                       data.positions.forEach(p => {
                           const plClass = p.profit >= 0 ? "pl up" : "pl down";
                           const sideClass = p.type === "BUY" ? "side BUY" : "side SELL";
                           ltHtml += `<div class="trade">
                             <div class="r1"><b>${p.symbol}</b><span class="${sideClass}">${p.type}</span><span style="color:#7c889f">${p.volume} LOT</span><span class="${plClass}">${formatCurrency(p.profit)}</span><button class="be-btn">BE</button><button class="x-btn">X</button></div>
                             <div class="r2">${p.price_open} → ${p.price_current} · #${p.ticket}</div>
                           </div>`;
                       });
                       if(data.positions.length === 0) ltHtml = `<div style="color:#64748b; font-size:11px; padding:10px;">No open positions</div>`;
                       liveTradesEl.innerHTML = ltHtml;
                   }
               }

               // Update Market Watchlist in Right Panel
               if (data.market) {
                   const watchlistEl = document.getElementById("watchlist");
                   if (watchlistEl) {
                       let wlHtml = "";
                       for (const [sym, tick] of Object.entries(data.market)) {
                           // Mock a change percentage for visual flair if not provided
                           const chg = (Math.random() * 2 - 1).toFixed(2);
                           const chgClass = chg >= 0 ? "px up" : "px down";
                           const chgText = chg >= 0 ? `+${chg}%` : `${chg}%`;
                           wlHtml += `<div class="wl"><span class="sym">${sym}</span><span class="${chgClass}">$${tick.ask} (${chgText})</span></div>`;
                       }
                       watchlistEl.innerHTML = wlHtml;
                   }
                   
                   const watchlistTable = document.getElementById("watchlist-table-body");
                   if (watchlistTable) {
                       let tableHtml = "";
                       for (const [sym, tick] of Object.entries(data.market)) {
                           const chg = (Math.random() * 2 - 1).toFixed(2);
                           const chgClass = chg >= 0 ? "chg-up" : "chg-down";
                           const chgText = chg >= 0 ? `+${chg}%` : `${chg}%`;
                           tableHtml += `<tr>
                             <td style="text-align:left; font-weight:800; color:#fff;">
                               <span style="color:#f59e0b; margin-right:6px;">⭐</span> ${sym}
                             </td>
                             <td style="text-align:right;">${tick.ask}</td>
                             <td style="text-align:right;"><span class="${chgClass}">${chgText}</span></td>
                             <td style="text-align:center;"><button class="t-btn-act" onclick="tradeSymbol('${sym}')">Trade</button></td>
                           </tr>`;
                       }
                       watchlistTable.innerHTML = tableHtml;
                   }
               }
            } else if (data.type === "MARKET_ANALYSIS_UPDATE") {
               // Update Analysis counts
               const kpiAnalysisTotal = document.getElementById("kpi-analysis-total");
               if (kpiAnalysisTotal) {
                   let total = parseInt(kpiAnalysisTotal.innerText.replace(/,/g, ''), 10) || 522175;
                   kpiAnalysisTotal.innerText = (total + 1).toLocaleString();
               }
               const kpiAnalysisToday = document.getElementById("kpi-analysis-today");
               if (kpiAnalysisToday) {
                   let today = parseInt(kpiAnalysisToday.innerText.replace(/,/g, ''), 10) || 733;
                   kpiAnalysisToday.innerText = (today + 1).toLocaleString();
               }
               // Update Analysis counts
               const kpiAnalysisTotal = document.getElementById("kpi-analysis-total");
               if (kpiAnalysisTotal) {
                   let total = parseInt(kpiAnalysisTotal.innerText.replace(/,/g, ''), 10) || 522175;
                   kpiAnalysisTotal.innerText = (total + 1).toLocaleString();
               }
               const kpiAnalysisToday = document.getElementById("kpi-analysis-today");
               if (kpiAnalysisToday) {
                   let today = parseInt(kpiAnalysisToday.innerText.replace(/,/g, ''), 10) || 733;
                   kpiAnalysisToday.innerText = (today + 1).toLocaleString();
               }
               const cleanSym = data.symbol;
               if (!window.aiDict) window.aiDict = {};
               
               const ma = data.data.market_analyst || {};
               const smc = data.data.smc_strategist || {};
               
               const isBullish = ma.trend && ma.trend.toLowerCase().includes('bullish');
               const isBearish = ma.trend && ma.trend.toLowerCase().includes('bearish');
               
               let bullPct = isBullish ? '70%' : (isBearish ? '30%' : '50%');
               let bearPct = isBullish ? '30%' : (isBearish ? '70%' : '50%');
               
               window.aiDict[cleanSym] = {
                 symText: `${cleanSym} เสนอแนะ`,
                 biasText: `HTF bias ${ma.trend || 'Neutral'}`,
                 bullPct: bullPct,
                 bearPct: bearPct,
                 neuText: `สัญญาณวิเคราะห์ AI: ${ma.trend || 'Neutral'}`,
                 mainText: ma.analysis || '',
                 structText: `Support: ${ma.support || '-'}, Resistance: ${ma.resistance || '-'}, Demand: ${ma.demand_zone || '-'}, Supply: ${ma.supply_zone || '-'}`,
                 recText: smc.setup || ''
               };
               
               const dashSelect = document.getElementById('dash-sym-select');
               if (dashSelect && dashSelect.value.includes(cleanSym)) {
                   if (typeof updateAiAnalysisCard === 'function') {
                       updateAiAnalysisCard(cleanSym);
                   }
               }
            } else if (data.type === "SYSTEM_ALERT") {
               const titleEl = document.getElementById("alert-title");
               const subEl = document.getElementById("alert-sub");
               if (titleEl) titleEl.innerText = data.title;
               if (subEl) subEl.innerText = data.message;
            } else if (data.type === "SIGNALS_UPDATE") {
               const dashCont = document.getElementById("dash-signals-container");
               const tradeCont = document.getElementById("trade-signals-container");
               const notifList = document.querySelector("#notif-menu .notif-list");
               const notifCount = document.querySelector("#notif-menu .notif-sub-count");
               const bellBadge = document.querySelector(".bell-badge");
               
               if (data.signals && data.signals.length > 0) {
                   let dashHtml = "";
                   let tradeHtml = "";
                   let notifHtml = "";
                   
                   data.signals.forEach(sig => {
                       const isBuy = sig.type === "BUY";
                       const color = isBuy ? "#10b981" : "#ef4444";
                       const dirLabel = isBuy ? "▲ BUY ฝั่งขาขึ้น" : "▼ SELL ฝั่งขาลง";
                       const badgeClass = isBuy ? "buy" : "sell";
                       const badgeLabel = isBuy ? "▲ BUY สัญญาณ" : "▼ SELL สัญญาณ";
                       
                       dashHtml += `<div class="signal-row-item" style="padding:10px 14px; background:rgba(15,23,42,0.6); border:1px solid rgba(255,255,255,0.06); border-radius:8px;">
                         <span class="signal-pair-name" style="font-weight:800; color:#fff;">${sig.symbol}</span>
                         <span class="signal-status-label" style="color:${color};">${dirLabel}</span>
                         <span style="font-size:11px; color:#60a5fa; font-weight:700;">Entry ${sig.price} • Conf ${sig.confidence}%</span>
                       </div>`;
                       
                       const commonNotifHtml = `<div class="notif-item" style="padding:10px 12px; background:rgba(255,255,255,0.015);">
                         <span class="notif-badge ${badgeClass}">${badgeLabel}</span>
                         <div class="notif-info">
                           <div class="notif-pair">${sig.symbol}</div>
                           <div class="notif-details">ราคา ${sig.price}</div>
                         </div>
                         <span class="notif-prob">${sig.confidence}%</span>
                       </div>`;
                       
                       tradeHtml += commonNotifHtml;
                       notifHtml += commonNotifHtml.replace('style="padding:10px 12px; background:rgba(255,255,255,0.015);"', 'onclick="window.selectNotifItem(\'' + sig.symbol + '\', event)" style="cursor:pointer;"');
                   });
                   
                   if (dashCont) dashCont.innerHTML = dashHtml;
                   if (tradeCont) tradeCont.innerHTML = tradeHtml;
                   if (notifList) notifList.innerHTML = notifHtml;
                   
                   const countText = `${data.signals.length} สัญญาณรอการกด`;
                   if (notifCount) notifCount.innerText = countText;
                   if (bellBadge) {
                       bellBadge.innerText = data.signals.length;
                       bellBadge.style.display = 'flex';
                   }
               } else {
                   const emptyMsg = `<div style="color:var(--text-muted); font-size:12px; padding:10px; text-align:center;">ไม่พบสัญญาณเทรดในรอบนี้</div>`;
                   if (dashCont) dashCont.innerHTML = emptyMsg;
                   if (tradeCont) tradeCont.innerHTML = emptyMsg;
                   if (notifList) notifList.innerHTML = emptyMsg;
                   if (notifCount) notifCount.innerText = "0 สัญญาณ";
                   if (bellBadge) bellBadge.style.display = 'none';
               }\n            } else if (data.type === "NEWS_UPDATE") {
               const timeEl = document.getElementById("news-update-time");
               if (timeEl) timeEl.innerText = `อัปเดต ${data.timestamp}`;
               
               const summaryEl = document.getElementById("news-summary-text");
               if (summaryEl) {
                   const riskColor = data.summary_risk.includes("สูง") ? "#ef4444" : "#10b981";
                   summaryEl.innerHTML = `<b style="color:${riskColor};">ความเสี่ยงพอร์ต: ${data.summary_risk}</b> ${data.summary_text}`;
               }
               
               const gridEl = document.getElementById("news-pairs-grid");
               if (gridEl && data.pairs) {
                   let gridHtml = "";
                   data.pairs.forEach(pair => {
                       // Assume pair has: symbol, impact ('เอนขาขึ้น', 'เอนขาลง', 'ทรงตัว'), color ('#10b981', '#ef4444', '#f59e0b'), text
                       let badgeBg = pair.color === "#10b981" ? "rgba(16,185,129,0.1)" : (pair.color === "#ef4444" ? "rgba(239,68,68,0.1)" : "rgba(245,158,11,0.1)");
                       gridHtml += `<div class="chart-container-card" style="padding:16px;">
                         <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                           <span style="font-weight:800; color:#fff; font-size:14px;">${pair.symbol}</span>
                           <span style="font-size:10px; font-weight:700; color:${pair.color}; background:${badgeBg}; border:1px solid ${pair.color}40; padding:2px 8px; border-radius:4px;">${pair.impact}</span>
                         </div>
                         <div style="font-size:11.5px; color:#94a3b8; line-height:1.5;">
                           ${pair.text}
                         </div>
                       </div>`;
                   });
                   gridEl.innerHTML = gridHtml;
               }
            } else if (data.type === "AGENT_UPDATE") {
               // Update AI Requests count
               const kpiAiReq = document.getElementById("kpi-ai-requests");
               if (kpiAiReq) {
                   let currentReqs = parseInt(kpiAiReq.innerText.replace(/,/g, ''), 10) || 42;
                   kpiAiReq.innerText = (currentReqs + 1).toLocaleString();
               }
               // Update AI Requests count
               const kpiAiReq = document.getElementById("kpi-ai-requests");
               if (kpiAiReq) {
                   let currentReqs = parseInt(kpiAiReq.innerText.replace(/,/g, ''), 10) || 42;
                   kpiAiReq.innerText = (currentReqs + 1).toLocaleString();
               }
               // Update Agent Bubble
               if (data.agent_id && typeof speechBubbles !== 'undefined') {
                   if (!speechBubbles[data.agent_id]) speechBubbles[data.agent_id] = [];
                   
                   let txt = data.status;
                   if (data.activity) txt = data.activity;
                   
                   // Keep only last 3 messages to rotate
                   speechBubbles[data.agent_id].unshift(txt);
                   if (speechBubbles[data.agent_id].length > 3) {
                       speechBubbles[data.agent_id].pop();
                   }
                   
                   appendLog(`[${data.agent_id.toUpperCase()}] ${txt}`, data.color || "#f59e0b");
                   
                   // --- Update Right Panel (Recent Activity) ---
                   const activityEl = document.getElementById("activity");
                   if (activityEl) {
                       const now = new Date();
                       const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
                       const newAct = `<div class="act"><span class="ti">${timeStr}</span><span class="ds" style="color:${data.color || '#38bdf8'}">[${data.agent_id.toUpperCase()}] ${txt}</span></div>`;
                       activityEl.innerHTML = newAct + activityEl.innerHTML;
                       // Keep only 5
                       while(activityEl.childElementCount > 5) activityEl.removeChild(activityEl.lastChild);
                   }
               }
            } else if (data.type === "MARKET_ANALYSIS_UPDATE") {
               const cleanSym = data.symbol;
               if (!window.aiDict) window.aiDict = {};
               
               const ma = data.data.market_analyst || {};
               const smc = data.data.smc_strategist || {};
               
               const isBullish = ma.trend && ma.trend.toLowerCase().includes('bullish');
               const isBearish = ma.trend && ma.trend.toLowerCase().includes('bearish');
               
               let bullPct = isBullish ? '70%' : (isBearish ? '30%' : '50%');
               let bearPct = isBullish ? '30%' : (isBearish ? '70%' : '50%');
               
               window.aiDict[cleanSym] = {
                 symText: `${cleanSym} เสนอแนะ`,
                 biasText: `HTF bias ${ma.trend || 'Neutral'}`,
                 bullPct: bullPct,
                 bearPct: bearPct,
                 neuText: `สัญญาณวิเคราะห์ AI: ${ma.trend || 'Neutral'}`,
                 mainText: ma.analysis || '',
                 structText: `Support: ${ma.support || '-'}, Resistance: ${ma.resistance || '-'}, Demand: ${ma.demand_zone || '-'}, Supply: ${ma.supply_zone || '-'}`,
                 recText: smc.setup || ''
               };
               
               const dashSelect = document.getElementById('dash-sym-select');
               if (dashSelect && dashSelect.value.includes(cleanSym)) {
                   if (typeof updateAiAnalysisCard === 'function') {
                       updateAiAnalysisCard(cleanSym);
                   }
               }
            } else if (data.type === "SYSTEM_ALERT") {
               const titleEl = document.getElementById("alert-title");
               const subEl = document.getElementById("alert-sub");
               if (titleEl) titleEl.innerText = data.title;
               if (subEl) subEl.innerText = data.message;
            }
          } catch(e) {
            console.error("WS Parse Error", e);
          }
        };
        
        ws.onclose = () => {
          appendLog(`[GATEWAY] Connection lost. Reconnecting in 5s...`, "#ef4444");
          setTimeout(connectMT5Gateway, 5000);
        };
        
        ws.onerror = (err) => {
          console.error("WS Error", err);
        };
      };
      
      // Start Connection
      connectMT5Gateway();
    </script>
  </body>
</html>
